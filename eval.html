<style>

    --red:#dc2626;--redbg:#fee2e2;--org:#b45309;--orgbg:#fef3c7;--blue:#1d4ed8;--bluebg:#dbeafe;--ok:#15803d;--okbg:#dcfce7}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:14px}

  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  @media (hover:none) and (pointer:coarse){input,select,textarea{font-size:16px}}
  #app{zoom:var(--z, 1)}
  .top{background:#efe6da;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .brand{font-weight:700;font-size:15px;margin-right:6px}
  .brand a{color:var(--sub);font-weight:400;font-size:12px;margin-left:8px;text-decoration:none}

  .cols3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #eee}

<body>
<div id="app"></div>
<div class="fz" title="調整字體大小">
  <button id="fzDown" aria-label="縮小字體">A−</button>
  <span class="lv" id="fzLv" title="恢復預設大小"></span>
  <button id="fzUp" aria-label="放大字體">A＋</button>
</div>
<script>
(function(){
  var KEY = 'evalZoom', DEF = 1, MIN = 0.8, MAX = 1.6, STEP = 0.1, z = DEF;
  try{ var v = parseFloat(localStorage.getItem(KEY)); if(v >= MIN && v <= MAX) z = v; }catch(e){}
  function apply(){
    z = Math.round(Math.min(MAX, Math.max(MIN, z)) * 100) / 100;
    document.documentElement.style.setProperty('--z', z);
    document.getElementById('fzLv').textContent = Math.round(z * 100) + '%';
    try{ localStorage.setItem(KEY, z); }catch(e){}
  }
  document.getElementById('fzDown').onclick = function(){ z -= STEP; apply(); };
  document.getElementById('fzUp').onclick = function(){ z += STEP; apply(); };
  document.getElementById('fzLv').onclick = function(){ z = DEF; apply(); };
  apply();
})();
</script>
<script type="module">
import { ConvexClient, ConvexHttpClient } from "https://esm.sh/convex@1.46.0/browser";
import { html, render, useState, useEffect, useMemo, useRef } from "https://unpkg.com/htm@3.1.1/preact/standalone.module.js";
import * as XLSX from "https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs";

// ★ 部署後把這裡換成新 Convex 專案的網址（eval-backend 資料夾 .env.local 裡的 CONVEX_URL）
const EVAL_URL = "https://agreeable-dachshund-648.convex.cloud";
const PORTAL_URL = "https://lelinsihuoffice-aa02.github.io/-care-tools/#cloud";
const ORG_TITLE = "樂臨企業有限公司附設雲林縣私立樂臨居家長照機構–A級單位(台西區)";

// ================= CORE-START（純邏輯：日期、時效、報表；不碰畫面與資料庫） =================
const pad = n => String(n).padStart(2, '0');
const WDN = ['日', '一', '二', '三', '四', '五', '六'];

// ---------- 日期 ----------
// 一律存成西元 'YYYY-MM-DD'；接受民國 115/10/12、115.10.12、1151012、115年10月12日、西元、Excel 日期序號
function parseDate(x) {
  if (x === null || x === undefined || x === '') return '';
  if (x instanceof Date && !isNaN(x)) return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
  if (typeof x === 'number') {
    if (x > 20000 && x < 80000) { // Excel 序號
      const d = new Date(Date.UTC(1899, 11, 30) + x * 86400000);
      return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    }
    x = String(x);
  }
  let s = String(x).trim().replace(/[年月.\-－／\s]/g, '/').replace(/日/g, '').replace(/\/+/g, '/').replace(/\/$/, '');
  let y, m, d, mm;
  if ((mm = s.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = s.match(/^(\d{3})(\d{2})(\d{2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = s.match(/^(\d{4})(\d{2})(\d{2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else return '';
  if (y < 1000) y += 1911;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return '';
  return `${y}-${pad(m)}-${pad(d)}`;
}
const toUTC = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fromUTC = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (iso, n) => fromUTC(toUTC(iso) + n * 86400000);
const calDays = (a, b) => (a && b) ? Math.round((toUTC(b) - toUTC(a)) / 86400000) : null;
const weekday = iso => new Date(toUTC(iso)).getUTCDay();
function addMonths(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(Math.min(d, last))}`;
}
// 民國顯示
function roc(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${+y - 1911}/${m}/${d}`; }
function rocMonth(mk) { const [y, m] = mk.split('-'); return `${+y - 1911}年${+m}月`; }
const monthOf = iso => iso ? iso.slice(0, 7) : '';
function shiftMonth(mk, n) { return addMonths(mk + '-01', n).slice(0, 7); }

// ---------- 工作天 ----------
// holidays：{ 'YYYY-MM-DD': '假日' | '颱風假' | '補班' }
function isWorkday(iso, holidays) {
  const k = holidays[iso];
  if (k === '補班') return true;
  if (k) return false;
  const w = weekday(iso);
  return w !== 0 && w !== 6;
}
// 起算日當天不算，從隔天數到截止日（含）。截止日早於起算日時回傳負數。
function workDays(a, b, holidays) {
  if (!a || !b) return null;
  if (a === b) return 0;
  const sign = b > a ? 1 : -1;
  let [from, to] = sign > 0 ? [a, b] : [b, a];
  let n = 0, d = addDays(from, 1);
  for (let guard = 0; d <= to && guard < 4000; guard++, d = addDays(d, 1)) if (isWorkday(d, holidays)) n++;
  return n * sign;
}
// 兩日期相差的「月+天」文字，以及是否超過 n 個月（期限 = 起算日加 n 個月的同一日）
function monthSpan(a, b) {
  if (!a || !b) return '';
  let months = 0;
  while (addMonths(a, months + 1) <= b) months++;
  const days = calDays(addMonths(a, months), b);
  return (months ? `${months}個月` : '') + (days || !months ? `${days}天` : '');
}
const overMonths = (a, b, n) => !!(a && b && b > addMonths(a, n));

// ---------- 觸發 ----------
const TRIGGERS = ['新案-初評', '新案-出備', '新案-轉入-初評', '新案-轉入-複評', '新案-轉入-AA01', '新案-轉入-AA02', '出轉初',
  '複評', 'AA01', '上月新案-初評', '上月新案-出備', '上月沒吃到錢', '結案-', '結案400-', '上月結案'];
// 統一寫法：去空白、全形符號轉半形、「轉入AA01」補上 -
function normTrigger(t) {
  let s = String(t || '').replace(/\s+/g, '').replace(/[－—–]/g, '-').replace(/ＡＡ/g, 'AA').toUpperCase().replace(/^新案-轉入(?!-)/, '新案-轉入-');
  return s;
}
const isNewTrigger = t => { t = normTrigger(t); return t.startsWith('新案') || t === '出轉初'; };
const isCloseTrigger = t => normTrigger(t).startsWith('結案');

// ---------- 地區 ----------
const REGIONS = { '04': '四湖', '05': '台西', '06': '麥寮', '07': '東勢' };
function parseCaseNo(no) {
  const m = String(no || '').replace(/\s/g, '').match(/^(.+?)-(\d{2})-(\d+)-(\d+)$/);
  if (!m) return null;
  return { prefix: m[1], region: m[2], seq: +m[3], reopen: +m[4] };
}
const regionOf = no => { const p = parseCaseNo(no); return p ? (REGIONS[p.region] || p.region) : '未知'; };

// ---------- 服務類別 ----------
// key：存在資料裡的代號；label：畫面名稱；col：總表欄名；stat：服務單位統計表的工作表名
const CATS = [
  { key: 'home', label: '居家', col: '居服單位', stat: 'B單位' },
  { key: 'prof', label: '專業碼', col: '復能', stat: 'C碼' },
  { key: 'traffic', label: '交通', col: '交通', stat: '交通' },
  { key: 'ctraffic', label: '社區交通', col: '社區交通', stat: '社區交通' },
  { key: 'resp', label: '居喘', col: '居喘', stat: '居喘' },
  { key: 'day', label: '日照', col: '日照', stat: '日照' },
  { key: 'dayresp', label: '日喘', col: '日照喘息', stat: '日喘' },
  { key: 'short', label: '短照', col: '短照(S)', stat: '短照' },
  { key: 'inst', label: '機喘', col: '機構喘息', stat: '機喘' },
  { key: 'meal', label: 'OT01', col: '送餐', stat: '餐飲(OT)' },
  { key: 'family', label: '家托', col: '家托', stat: '家托' },
  { key: 'bath', label: '沐浴車', col: '沐浴車', stat: '沐浴車' },
  { key: 'aids', label: '輔具', col: '輔具', stat: '輔具' },
  { key: 'small', label: '小規機', col: '小規機', stat: '小規機' },
];
const CAT = Object.fromEntries(CATS.map(c => [c.key, c]));

// ---------- 服務單位名稱統一 ----------
const normName = s => String(s || '').replace(/[\s ]/g, '').replace(/⾧/g, '長').replace(/^雲林縣-/, '').replace(/（/g, '(').replace(/）/g, ')');
// units：[{ name, short, aliases:[] }]；回傳統一後的顯示名稱（有簡稱用簡稱）
function makeUnitResolver(units) {
  const exact = new Map(), list = [];
  for (const u of units) {
    const show = u.short || u.name;
    for (const n of [u.name, u.short, ...(u.aliases || [])]) if (n) exact.set(normName(n), show);
    if (u.short) list.push([normName(u.short), show]);
  }
  return raw => {
    const n = normName(raw);
    if (!n) return '';
    if (exact.has(n)) return exact.get(n);
    const hit = list.find(([s]) => n.includes(s) || s.includes(n));
    return hit ? hit[1] : String(raw).trim();
  };
}

// ---------- 原因選項 ----------
const OPTS = {
  referBLate: ['1.個管人力不足', '2.聯絡不到家屬/個案', '3.B單位拒絕服務', '4.照專逾3天簽審', '5.其他'],
  dispatchMech: ['1.個案意願', '2.輪派', '3.唯一提供單位'],
  bLate: ['1.服務單位人力不足', '2.個案住院', '3.個案無需求暫停服務', '4.聯絡不到家屬/個案', '5.案家服務特別需求', '6.其他'],
  assignMech: ['1.個案意願', '2.輪派'],
  aa01Reason: ['1.家屬因素', '2.個案因素', '3.重新開案', '4.其他'],
};

// ---------- 報表 ----------
// 每份報表 = 篩選條件 + 欄位定義。欄位：
//   h 標題；v(r) 顯示值；date 欄位為日期（顯示民國）；num 為天數；bad(r) 回傳警示文字；
//   edit 為可在報表直接填寫的事件欄位（opts 下拉、type:'date' 日期、其他為文字）
const cmsNum = c => parseInt(String(c || '').replace(/\D/g, ''), 10) || null;
// 督導審核日：出備個案改用出院日期
const supDate = r => normTrigger(r.e.trigger) === '新案-出備' ? r.e.discharge : r.e.supervisor;

const REPORTS = {
  dispatch: {
    title: '個管員派案時效及品質名冊', note: '當月新案（含出轉初）',
    filter: e => isNewTrigger(e.trigger),
    cols: [
      { h: '序號', v: r => r.i },
      { h: '姓名', v: r => r.c.name },
      { h: '身分證號', v: r => r.c.idNo },
      { h: 'CMS', v: r => r.c.cms },
      { h: '照專評估日期', date: 1, v: r => r.e.assess },
      { h: '轉介A單位日期', date: 1, v: r => r.e.referA },
      { h: '督導審核日期', date: 1, v: r => supDate(r), hint: '出備個案顯示出院日期' },
      { h: '個管照顧計畫送審日期', date: 1, v: r => r.e.submit },
      { h: '照專簽審日期', date: 1, v: r => r.e.approve },
      { h: '照會B單位日期', date: 1, v: r => r.e.referB },
      { h: '訪案及計畫擬定(工作天)', num: 1, v: r => r.k.plan, bad: r => r.k.plan > 3 ? '逾3天' : r.k.plan < 0 ? '日期順序錯誤' : '' },
      { h: '逾3天未完成計畫擬定原因', edit: 'planLate', need: r => r.k.plan > 3 },
      { h: '照管中心評估後轉介至A(日曆天)', num: 1, v: r => r.k.toA },
      { h: '個管照會B單位(工作天)', num: 1, v: r => r.k.toB, bad: r => r.k.toB > 3 ? '逾3天' : r.k.toB < 0 ? '日期順序錯誤' : '' },
      { h: '逾3天未完成照會B單位原因', edit: 'referBLate', opts: OPTS.referBLate, need: r => r.k.toB > 3 },
      { h: '派案B單位機制', edit: 'dispatchMech', opts: OPTS.dispatchMech },
      { h: 'B單位第一次提供服務日期', edit: 'bFirst', type: 'date' },
      { h: '服務連結時效(日曆天)', num: 1, v: r => r.k.link, bad: r => r.k.link > 6 ? '超過3+3天，請檢視' : '' },
      { h: 'B單位逾3+3天未提供服務原因', edit: 'bLate', opts: OPTS.bLate, need: r => r.k.link > 6 },
      { h: '服務逾期追蹤日期', edit: 'followDate', type: 'date' },
      { h: '服務逾期追蹤結果', edit: 'followResult' },
      { h: '照專派貴單位的機制', edit: 'assignMech', opts: OPTS.assignMech },
    ],
    calc: (r, H) => ({
      plan: workDays(supDate(r), r.e.submit, H),
      toA: calDays(r.e.assess, r.e.referA),
      toB: workDays(r.e.approve, r.e.referB, H),
      link: calDays(r.e.referB, r.e.bFirst),
    }),
    summary: rows => [
      ['訪案及計畫擬定3天內完成率', rate(rows, r => r.k.plan, x => x <= 3)],
      ['照管中心評估後轉介至A平均天數', avg(rows, r => r.k.toA)],
      ['個管照會B單位平均天數（工作天）', avg(rows, r => r.k.toB)],
    ],

    const r = { i: idx + 1, e, c, caseId: e.caseId, month, svc };

// ---------- 月統計（在案、新案、結案、最新總數） ----------
// 開案月 = 第一筆新案觸發的月份，沒有則用開案日期、申請日期
// 結案月 = 第一筆結案觸發的月份
function caseMonths(db) {
  const info = new Map();
  for (const [id, c] of db.cases) info.set(id, { open: monthOf(c.openDate) || monthOf(c.applyDate) || '', close: '' });
  const evs = [...db.events].sort((a, b) => a.month.localeCompare(b.month));
  for (const e of evs) {
    const x = info.get(e.caseId); if (!x) continue;
    if (isNewTrigger(e.trigger) && (!x.openEv)) { x.open = e.month; x.openEv = true; }
    if (isCloseTrigger(e.trigger) && !x.close) x.close = e.month;
  }
  return info;
}
function srcGroup(src) {
  const s = String(src || '');
  if (s.includes('出備')) return '出備';
  if (s.includes('轉入')) return '轉入';
  if (s.includes('初評')) return '初評';
  return '未填';
}
function monthSummary(month, db) {
  const info = caseMonths(db), prev = shiftMonth(month, -1);
  const regs = [...Object.values(REGIONS), '未知'];
  const blank = () => Object.fromEntries(regs.map(r => [r, 0]));
  const s = { inCase: blank(), newCase: blank(), closed: blank(), latest: blank(), src: { 出備: 0, 初評: 0, 轉入: 0, 未填: 0 }, anomaly: [] };
  for (const [id, c] of db.cases) {
    const x = info.get(id); if (!x || !x.open) continue;
    // 結案早於開案（例如同一個編號結案後又重開）：資料有問題，列出來請人工檢查
    if (x.close && x.close < x.open) { if (x.open <= month) s.anomaly.push(c.caseNo); continue; }
    const rg = regionOf(c.caseNo);
    const activeEnd = m => x.open <= m && !(x.close && x.close <= m);
    if (activeEnd(prev)) { s.inCase[rg]++; s.src[srcGroup(c.src)]++; }
    if (x.open === month) s.newCase[rg]++;
    if (x.close === month && x.open <= month) s.closed[rg]++;
    if (activeEnd(month)) s.latest[rg]++;
  }
  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  s.total = { inCase: sum(s.inCase), newCase: sum(s.newCase), closed: sum(s.closed), latest: sum(s.latest) };
  s.check = s.total.inCase + s.total.newCase - s.total.closed === s.total.latest;
  return s;
}

    const c = { services: {} }, e = { services: {} }; let caseNo = '';
    heads.forEach((h, j) => {

      let val = row[j]; if (val === undefined || val === null) val = '';

      if (m[2] === 'date') val = parseDate(val); else val = String(val).trim();

    rows.push({ caseNo, c, e: hasTrigger ? e : null, month });

// 第一次開啟會下載全部資料，之後只下載別人改過的部分，大幅節省 Convex 免費額度。
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('evalCache', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } },
  async set(k, v) { try { const db = await this.open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) { } },
  async clear() { try { const db = await this.open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').clear(); t.oncomplete = res; t.onerror = res; }); } catch (e) { } },
};
const TABLES = ['cases', 'events', 'units', 'holidays'];
const CACHE_KEY = 'cache:' + EVAL_URL;
const store = { rows: { cases: new Map(), events: new Map(), units: new Map(), holidays: new Map() }, since: { cases: 0, events: 0, units: 0, holidays: 0 } };
async function loadCache() {
  const c = await IDB.get(CACHE_KEY);
  if (!c) return;
  for (const t of TABLES) { store.rows[t] = new Map((c.rows[t] || []).map(x => [x._id, x])); store.since[t] = c.since[t] || 0; }
}
let syncing = null;
async function syncAll() {
  if (syncing) return syncing;
  syncing = (async () => {
    let changed = 0;
    for (const t of TABLES) {
      let cursor = null, max = store.since[t];
      for (; ;) {
        const r = await call('q', 'data:sync', { table: t, since: store.since[t], paginationOpts: { numItems: 500, cursor } });
        for (const x of r.page) {
          const old = store.rows[t].get(x._id);
          if (!old || old.updatedAt !== x.updatedAt || old.d !== x.d || old.deleted !== x.deleted) changed++;
          if (x.deleted) store.rows[t].delete(x._id); else store.rows[t].set(x._id, x);
          if (x.updatedAt > max) max = x.updatedAt;
        }
        if (r.isDone) break;
        cursor = r.continueCursor;
      }
      store.since[t] = max;
    }
    if (changed) await IDB.set(CACHE_KEY, { since: store.since, rows: Object.fromEntries(TABLES.map(t => [t, [...store.rows[t].values()]])) });
    return changed;
  })().finally(() => { syncing = null; });
  return syncing;
}

  const [txt, setTxt] = useState(value || '');
  useEffect(() => setTxt(value || ''), [value]);
  if (opts) return html`<select class="inp" style=${'width:' + (width || 150) + 'px'} value=${value || ''} onChange=${e => onChange(e.target.value)}>
    <option value=""></option>${opts.map(o => html`<option value=${o}>${o}</option>`)}
    ${value && !opts.includes(value) ? html`<option value=${value}>${value}</option>` : ''}</select>`;
  return html`<input class="inp" style=${'width:' + (width || 170) + 'px'} value=${txt} onInput=${e => setTxt(e.target.value)}
    onBlur=${() => { if ((txt || '') !== (value || '')) onChange(txt); }} onKeyDown=${e => e.key === 'Enter' && e.target.blur()} />`;
}
function ConfirmBtn({ label, onYes, cls }) {
  const [arm, setArm] = useState(false);
  useEffect(() => { if (arm) { const t = setTimeout(() => setArm(false), 4000); return () => clearTimeout(t); } }, [arm]);
  return html`<button class=${'btn ' + (arm ? 'red' : (cls || 'light'))} onClick=${() => arm ? (setArm(false), onYes()) : setArm(true)}>${arm ? '再按一次確認' : label}</button>`;
}

// ================= Excel 匯出 =================
function sheetFromAoa(aoa, widths, merges) {
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  if (widths) ws['!cols'] = widths.map(w => ({ wch: w }));
  if (merges) ws['!merges'] = merges;
  return ws;
}
function reportAoa(key, month, db) {
  const { R, rows, summary } = buildReport(key, month, db);
  const head = R.cols.map(c => c.h);
  const aoa = [[`${ORG_TITLE}\n${rocMonth(month)}-${R.title}`], head, ...rows.map(r => R.cols.map(c => cellText(c, r)))];
  if (summary.length) { aoa.push([]); for (const [k, v] of summary) aoa.push([k, String(v)]); }
  return sheetFromAoa(aoa, R.cols.map(c => Math.max(8, Math.min(26, c.h.length * 2))), [{ s: { r: 0, c: 0 }, e: { r: 0, c: head.length - 1 } }]);
}
function exportReport(key, month, db, wholeYear) {
  const wb = XLSX.utils.book_new(), R = REPORTS[key];
  if (wholeYear) {
    const y = month.slice(0, 4);
    for (let m = 1; m <= 12; m++) XLSX.utils.book_append_sheet(wb, reportAoa(key, `${y}-${pad(m)}`, db), `${m}月`);
    XLSX.writeFile(wb, `${+y - 1911}年${R.title}.xlsx`);
  } else {
    XLSX.utils.book_append_sheet(wb, reportAoa(key, month, db), rocMonth(month));
    XLSX.writeFile(wb, `${rocMonth(month)}${R.title}.xlsx`);
  }
}
// 服務單位統計：每個服務類別一個工作表，列 = 月份，欄 = 單位（與原本統計表相同格式）
function exportUnitStats(kind, year, db) {
  const wb = XLSX.utils.book_new();
  const months = Array.from({ length: 12 }, (_, i) => `${year}-${pad(i + 1)}`);
  const per = months.map(m => unitStats(kind, m, db));
  for (const cat of CATS) {
    const units = [...new Set(per.flatMap(p => Object.keys(p[cat.key] || {})))].sort();
    const aoa = [['月份', ...units, '合計']];
    months.forEach((m, i) => { const o = per[i][cat.key] || {}; const vals = units.map(u => o[u] || ''); aoa.push([roc(m + '-01').slice(0, -3), ...vals, units.reduce((a, u) => a + (o[u] || 0), 0) || '']); });
    aoa.push(['總計', ...units.map(u => per.reduce((a, p) => a + ((p[cat.key] || {})[u] || 0), 0)), per.reduce((a, p) => a + Object.values(p[cat.key] || {}).reduce((x, y) => x + y, 0), 0)]);
    XLSX.utils.book_append_sheet(wb, sheetFromAoa(aoa, [8, ...units.map(u => Math.min(30, Math.max(8, u.length * 2))), 6]), cat.stat);
  }
  XLSX.writeFile(wb, `${+year - 1911}年${kind === 'new' ? '新案' : '複評'}服務單位統計.xlsx`);
}

function CaseEditor({ db, month, user, id, onClose, refresh }) {
  const orig = id ? db.cases.get(id) : null;
  const nextNo = rg => { let mx = 0; for (const c of db.cases.values()) { const p = parseCaseNo(c.caseNo); if (p && p.region === rg && p.seq > mx) mx = p.seq; } return `台-${rg}-${String(mx + 1).padStart(3, '0')}-1`; };
  const [caseNo, setCaseNo] = useState(orig ? orig.caseNo : nextNo('05'));
  const [c, setC] = useState(() => ({ ...(orig || {}), services: { ...((orig || {}).services || {}) } }));
  const [em, setEm] = useState(month);
  const evOrig = useMemo(() => db.events.find(e => e.caseId === id && e.month === em) || null, [db, id, em]);
  const [ev, setEv] = useState(() => ({ ...(evOrig || {}), services: { ...((evOrig || {}).services || {}) } }));
  useEffect(() => setEv({ ...(evOrig || {}), services: { ...((evOrig || {}).services || {}) } }), [evOrig]);
  const [busy, setBusy] = useState(false);
  const hist = useMemo(() => db.events.filter(e => e.caseId === id).sort((a, b) => b.month.localeCompare(a.month)), [db, id]);
  const unitNames = useMemo(() => [...new Set(db.units.map(u => u.short || u.name).filter(Boolean))], [db]);

  const diff = (a, b) => { const out = {}; for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) { if (k.startsWith('_') || k === 'caseId' || k === 'month' || k === 'caseNo') continue; if (JSON.stringify(a[k] ?? '') !== JSON.stringify(b[k] ?? '')) out[k] = b[k] ?? ''; } return out; };
  const save = async () => {
    if (!caseNo.trim() || !parseCaseNo(caseNo)) return toast('編號格式應為 台-05-178-1', true);
    if (!String(c.name || '').trim()) return toast('請填寫姓名', true);
    if (ev.discharge && ev.visit && ev.visit <= ev.discharge) return toast('個管訪視日期必須晚於出院日期（出院當天不能訪視）', true);
    setBusy(true);
    try {
      let cid = id;
      const cp = diff(orig || {}, c);
      if (!id || Object.keys(cp).length || caseNo !== orig.caseNo) cid = await call('m', 'data:saveCase', { id, caseNo: caseNo.trim(), d: JSON.stringify(id ? cp : c), by: user });
      const ep = diff(evOrig || {}, ev);
      if (Object.keys(ep).length) await call('m', 'data:patchEvent', { caseId: cid, month: em, patch: JSON.stringify(ep), by: user });
      await refresh(); toast('已儲存'); onClose();
    } catch (e) { console.error(e); toast('儲存失敗：' + (e.message || e), true); }
    setBusy(false);
  };
  const del = async () => {
    setBusy(true);
    try { await call('m', 'data:remove', { table: 'cases', id, by: user }); await refresh(); toast('已刪除個案'); onClose(); }
    catch (e) { toast('刪除失敗：' + e.message, true); }
    setBusy(false);
  };
  const delEv = async () => {
    try { await call('m', 'data:remove', { table: 'events', id: evOrig._id, by: user }); await refresh(); toast(`已刪除 ${rocMonth(em)} 的觸發紀錄`); }
    catch (e) { toast('刪除失敗：' + e.message, true); }
  };
  const field = (obj, set) => ([k, label, t]) => html`<label>${label}
    ${t === 'date' ? html`<${DateInput} style="width:100%" value=${obj[k] || ''} onChange=${v => set({ ...obj, [k]: v })} />`
      : Array.isArray(t) ? html`<input class="inp" list=${'dl-' + k} value=${obj[k] || ''} onInput=${e => set({ ...obj, [k]: e.target.value })} /><datalist id=${'dl-' + k}>${t.map(o => html`<option value=${o} />`)}</datalist>`
        : html`<input class="inp" value=${obj[k] || ''} onInput=${e => set({ ...obj, [k]: e.target.value })} />`}</label>`;

  return html`<div class="modal" onClick=${e => e.target === e.currentTarget && onClose()}><div class="drawer">
    <div class="bar"><h2 style="margin:0">${id ? `${orig.name}　${orig.caseNo}` : '新增個案'}</h2><span class="grow"></span>
      ${id && html`<${ConfirmBtn} label="刪除個案" onYes=${del} />`}
      <button class="btn light" onClick=${onClose}>關閉</button><button class="btn" disabled=${busy} onClick=${save}>${busy ? '儲存中…' : '儲存'}</button></div>
    <div class="card">
      <div class="sect" style="margin-top:0">基本資料</div>
      <div class="form">
        <label>個案編號<span style="display:flex;gap:4px"><input class="inp" style="flex:1" value=${caseNo} onInput=${e => setCaseNo(e.target.value)} />
          ${!id && html`<select class="inp" title="依地區自動編號" onChange=${e => setCaseNo(nextNo(e.target.value))}>${Object.entries(REGIONS).map(([k, v]) => html`<option value=${k} selected=${k === '05'}>${v}</option>`)}</select>`}</span>
          <span class="sub">地區：${regionOf(caseNo)}；尾數 1 新案、2 重開案</span></label>
        ${CASE_FIELDS.map(field(c, setC))}
      </div>
      <div class="sect">目前服務單位</div>
      <div class="form">${CATS.map(cat => html`<label>${cat.label}<input class="inp" list="dl-units" value=${c.services[cat.key] || ''}
        onInput=${e => setC({ ...c, services: { ...c.services, [cat.key]: e.target.value } })} /></label>`)}</div>
      <datalist id="dl-units">${unitNames.map(u => html`<option value=${u} />`)}</datalist>
    </div>
    <div class="card">
      <div class="bar" style="margin-bottom:4px"><div class="sect" style="margin:0">觸發紀錄</div>
        <label class="sub">月份 <input class="inp" type="month" value=${em} onChange=${e => e.target.value && setEm(e.target.value)} /></label>
        <span class="grow"></span>${evOrig && html`<${ConfirmBtn} label=${'刪除' + rocMonth(em) + '觸發'} onYes=${delEv} />`}</div>
      ${hist.length > 0 && html`<div class="hist" style="margin-bottom:10px">${hist.map(e => html`<button class=${e.month === em ? 'on' : ''} onClick=${() => setEm(e.month)}>${rocMonth(e.month)} ${e.trigger || ''}</button>`)}</div>`}
      <div class="form">
        <label>觸發<input class="inp" list="dl-trig" value=${ev.trigger || ''} onInput=${e => setEv({ ...ev, trigger: e.target.value })} onBlur=${e => setEv({ ...ev, trigger: normTrigger(e.target.value) })} />
          <datalist id="dl-trig">${TRIGGERS.map(t => html`<option value=${t} />`)}</datalist></label>
        ${EVENT_DATES.map(([k, label]) => html`<label>${label}<${DateInput} style="width:100%" value=${ev[k] || ''} onChange=${v => setEv({ ...ev, [k]: v })} /></label>`)}
        <label>服務代碼<input class="inp" value=${ev.codes || ''} onInput=${e => setEv({ ...ev, codes: e.target.value })} /></label>
      </div>
      ${ev.discharge && ev.visit && ev.visit <= ev.discharge && html`<div class="tag t-warn" style="margin-top:8px">個管訪視日期必須晚於出院日期</div>`}
      <div class="sub" style="margin-top:8px">逾期原因、派案機制、追蹤結果等欄位，可以直接在「評鑑報表」裡填寫。</div>
    </div>
  </div></div>`;
}

      <div class="card"><h3>在案來源（上月結轉）</h3>

        <div class="kv"><span>合計</span><b>${ms.src.出備 + ms.src.初評 + ms.src.轉入 + ms.src.未填}</b></div>
        ${ms.src.未填 > 0 && html`<div class="sub" style="margin-top:6px">有 ${ms.src.未填} 案沒有填申請來源，請到總表補上。</div>`}</div>
      <div class="card"><h3>${rocMonth(month)}觸發計數</h3>
        ${Object.keys(tc).length === 0 ? html`<div class="sub">本月沒有觸發紀錄</div>` : Object.entries(tc).sort((a, b) => b[1] - a[1]).map(([k, v]) => html`<div class="kv"><span>${k}</span><b>${v}</b></div>`)}
        <div class="sub" style="margin-top:6px">核銷金額待確認各觸發對應的單價後加入。</div></div>
    </div>` : html`<div class="cols3">${CATS.filter(cat => us[cat.key]).map(cat => html`<div class="card"><h3>${cat.stat}</h3>
        ${Object.entries(us[cat.key]).sort((a, b) => b[1] - a[1]).map(([u, n]) => html`<div class="kv"><span>${u}</span><b>${n}</b></div>`)}</div>`)}
      ${Object.keys(us).length === 0 && html`<div class="card empty">${rocMonth(month)}沒有${sub === 'new' ? '新案' : '複評'}的服務單位資料</div>`}</div>`}
  </div>`;
}

// ================= 匯入 =================
function guessMonth(name) {
  const s = String(name).replace(/\s/g, '');
  let m = s.match(/(\d{3})年?(\d{1,2})月?/); if (m && +m[2] >= 1 && +m[2] <= 12) return `${+m[1] + 1911}-${pad(+m[2])}`;
  m = s.match(/^(\d{1,2})月$/); if (m) return `${new Date().getFullYear()}-${pad(+m[1])}`;
  return '';
}
function ImportView({ db, user, refresh, month }) {
  const [wb, setWb] = useState(null), [fname, setFname] = useState(''), [sheet, setSheet] = useState(''), [mk, setMk] = useState(month);
  const [busy, setBusy] = useState(false), [prog, setProg] = useState(''), [result, setResult] = useState(null);
  const parsed = useMemo(() => {
    if (!wb || !sheet) return null;
    try { return parseSummarySheet(XLSX.utils.sheet_to_json(wb.Sheets[sheet], { header: 1, raw: true, defval: '' }), mk); }
    catch (e) { return { error: e.message }; }
  }, [wb, sheet, mk]);
  const pick = async f => {
    if (!f) return;
    setResult(null); setFname(f.name);
    try {
      const w = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      setWb(w); const first = w.SheetNames[w.SheetNames.length - 1]; setSheet(first); const g = guessMonth(first); if (g) setMk(g);
    } catch (e) { toast('無法讀取這個檔案：' + e.message, true); }
  };
  const byNo = useMemo(() => new Set([...db.cases.values()].map(c => c.caseNo)), [db]);
  const run = async () => {
    setBusy(true); const st = { created: 0, updated: 0, unchanged: 0, events: 0 };
    try {
      const rows = parsed.rows, B = 80;
      for (let i = 0; i < rows.length; i += B) {
        setProg(`匯入中… ${Math.min(i + B, rows.length)} / ${rows.length}`);
        const r = await call('m', 'data:importBatch', { rows: rows.slice(i, i + B).map(x => ({ caseNo: x.caseNo, caseD: JSON.stringify(x.c), month: x.month, eventD: x.e ? JSON.stringify(x.e) : undefined })), by: user });
        for (const k in st) st[k] += r[k];
      }
      await refresh(); setResult(st); toast('匯入完成');
    } catch (e) { console.error(e); toast('匯入失敗：' + e.message, true); }
    setProg(''); setBusy(false);
  };
  return html`<div class="page"><div class="card">
    <h2>匯入個案總表 Excel</h2>
    <div class="sub" style="margin-bottom:12px;line-height:1.8">一次匯入一個月份的工作表。系統用「編號」比對個案：已存在的會更新，新的會新增；Excel 空白的欄位不會把系統裡已填的資料清掉。<br/>有填「觸發」的列，會建立該月份的觸發紀錄（日期取該列的最新日期）。同一個月重複匯入不會產生重複資料。</div>
    <div class="bar"><input type="file" accept=".xlsx,.xls" onChange=${e => pick(e.target.files[0])} />
      ${wb && html`<select class="inp" value=${sheet} onChange=${e => { setSheet(e.target.value); setResult(null); const g = guessMonth(e.target.value); if (g) setMk(g); }}>${wb.SheetNames.map(n => html`<option value=${n}>${n}</option>`)}</select>
        <label class="sub">這張工作表是 <input class="inp" type="month" value=${mk} onChange=${e => { if (e.target.value) { setMk(e.target.value); setResult(null); } }} /> 的總表</label>`}</div>
    ${parsed && parsed.error && html`<div class="tag t-warn">${parsed.error}</div>`}
    ${parsed && parsed.rows && html`<div>
      <div class="chips">
        <div class="chip"><span class="sub">個案列數</span><b>${parsed.rows.length}</b></div>
        <div class="chip"><span class="sub">系統裡已有</span><b>${parsed.rows.filter(r => byNo.has(r.caseNo)).length}</b></div>
        <div class="chip"><span class="sub">新個案</span><b>${parsed.rows.filter(r => !byNo.has(r.caseNo)).length}</b></div>
        <div class="chip"><span class="sub">${rocMonth(mk)}有觸發</span><b>${parsed.rows.filter(r => r.e).length}</b></div>
      </div>
      ${parsed.unknownHeaders.length > 0 && html`<div class="sub" style="margin-bottom:8px">以下欄位系統不認得，不會匯入：${parsed.unknownHeaders.join('、')}</div>`}
      <div class="tw" style="max-height:300px"><table class="grid"><thead><tr><th>編號</th><th>姓名</th><th>觸發</th><th>照專評估</th><th>訪視</th><th>照專簽審</th><th>居服單位</th></tr></thead>
        <tbody>${parsed.rows.slice(0, 30).map(r => html`<tr><td>${r.caseNo}</td><td>${r.c.name}</td><td>${r.e ? r.e.trigger : ''}</td><td>${roc(r.c.latest.assess)}</td><td>${roc(r.c.latest.visit)}</td><td>${roc(r.c.latest.approve)}</td><td>${r.c.services.home || ''}</td></tr>`)}</tbody></table></div>
      ${parsed.rows.length > 30 && html`<div class="sub">只顯示前 30 列</div>`}
      <div class="bar" style="margin-top:12px"><button class="btn" disabled=${busy || !parsed.rows.length} onClick=${run}>${busy ? prog : `匯入 ${parsed.rows.length} 列到 ${rocMonth(mk)}`}</button>
        ${result && html`<span class="tag t-ok">完成：新增 ${result.created}、更新 ${result.updated}、未變動 ${result.unchanged}、觸發紀錄 ${result.events}</span>`}</div>
    </div>`}
    ${!wb && html`<div class="sub">${fname || '請選擇個案總表 Excel 檔'}</div>`}
  </div></div>`;
}

// ================= 設定：服務單位、假日 =================
function UnitsCard({ db, user, refresh }) {
  const [edit, setEdit] = useState(null), [q, setQ] = useState('');
  const save = async () => {
    if (!String(edit.name || '').trim()) return toast('請填寫單位全名', true);
    const d = { name: edit.name.trim(), short: (edit.short || '').trim(), aliases: String(edit.aliasesText ?? (edit.aliases || []).join('\n')).split(/\n/).map(s => s.trim()).filter(Boolean), cats: edit.cats || [] };
    try { await call('m', 'data:saveUnit', { id: edit._id, d: JSON.stringify(d), by: user }); await refresh(); setEdit(null); toast('已儲存'); }
    catch (e) { toast('儲存失敗：' + e.message, true); }
  };
  const del = async u => { try { await call('m', 'data:remove', { table: 'units', id: u._id, by: user }); await refresh(); } catch (e) { toast('刪除失敗：' + e.message, true); } };
  // 找出資料裡出現、但還沒對應到單位主檔的名稱
  const unmatched = useMemo(() => {
    const known = new Set(db.units.map(u => u.short || u.name)), out = new Map();
    const add = raw => { if (!raw) return; const r = db.resolveUnit(raw); if (!known.has(r)) out.set(r, (out.get(r) || 0) + 1); };
    for (const c of db.cases.values()) Object.values(c.services || {}).forEach(add);
    for (const e of db.events) Object.values(e.services || {}).forEach(add);
    return [...out.entries()].sort((a, b) => b[1] - a[1]);
  }, [db]);
  const list = db.units.filter(u => !q || (u.name + u.short + (u.aliases || []).join()).includes(q)).sort((a, b) => (a.short || a.name).localeCompare(b.short || b.name, 'zh-Hant'));
  return html`<div class="card">
    <div class="bar"><h3 style="margin:0">服務單位主檔</h3><span class="sub">統一同一單位的不同寫法，統計時才不會被拆成兩個</span><span class="grow"></span>
      <input class="inp" placeholder="搜尋" value=${q} onInput=${e => setQ(e.target.value)} /><button class="btn" onClick=${() => setEdit({ cats: [] })}>＋ 新增單位</button></div>
    ${edit && html`<div class="card" style="background:#FDFBF6"><div class="form">
      <label>單位全名<input class="inp" value=${edit.name || ''} onInput=${e => setEdit({ ...edit, name: e.target.value })} /></label>
      <label>簡稱（報表顯示用）<input class="inp" value=${edit.short || ''} onInput=${e => setEdit({ ...edit, short: e.target.value })} /></label>
      <label style="grid-column:1/-1">其他寫法（一行一個，例如舊名稱、少了「事業」兩字的寫法）<textarea class="inp" rows="3" value=${edit.aliasesText ?? (edit.aliases || []).join('\n')} onInput=${e => setEdit({ ...edit, aliasesText: e.target.value })}></textarea></label>
      <div style="grid-column:1/-1"><span class="sub">服務類別</span><div class="hist" style="margin-top:4px">${CATS.map(cat => html`<button class=${(edit.cats || []).includes(cat.key) ? 'on' : ''}
        onClick=${() => { const s = new Set(edit.cats || []); s.has(cat.key) ? s.delete(cat.key) : s.add(cat.key); setEdit({ ...edit, cats: [...s] }); }}>${cat.stat}</button>`)}</div></div>
    </div><div class="bar" style="margin-top:10px"><button class="btn" onClick=${save}>儲存</button><button class="btn light" onClick=${() => setEdit(null)}>取消</button></div></div>`}
    <div class="tw" style="max-height:420px"><table class="grid"><thead><tr><th>簡稱</th><th>全名</th><th>其他寫法</th><th>類別</th><th></th></tr></thead>
      <tbody>${list.map(u => html`<tr><td><b>${u.short}</b></td><td>${u.name}</td><td class="sub">${(u.aliases || []).join('、')}</td><td>${(u.cats || []).map(k => CAT[k] ? CAT[k].stat : k).join('、')}</td>
        <td><button class="btn sm light" onClick=${() => setEdit({ ...u })}>編輯</button> <${ConfirmBtn} label="刪除" onYes=${() => del(u)} /></td></tr>`)}</tbody></table></div>
    ${unmatched.length > 0 && html`<div style="margin-top:10px"><div class="sub">資料裡出現、但還沒建立主檔的單位名稱（點一下建立）：</div>
      <div class="hist" style="margin-top:6px">${unmatched.slice(0, 60).map(([n, k]) => html`<button onClick=${() => setEdit({ name: n, short: n.length <= 6 ? n : '', cats: [] })}>${n}（${k}）</button>`)}</div></div>`}
  </div>`;
}
function HolidaysCard({ db, user, refresh }) {

  return html`<div class="card">

      <select class="inp" value=${year} onChange=${e => setYear(e.target.value)}>${[2025, 2026, 2027].map(y => html`<option value=${y}>${y - 1911}年</option>`)}</select>
      ${year === '2026' && html`<button class="btn light" onClick=${() => add(HOLIDAYS_2026.map(([d, n]) => [d, '假日', n]))}>載入115年國定假日</button>`}</div>
    <div class="bar"><${DateInput} value=${nd} onChange=${setNd} />

      <input class="inp" placeholder="說明（例：康芮颱風）" value=${name} onInput=${e => setName(e.target.value)} />
      <button class="btn" disabled=${!nd} onClick=${async () => { await add([[nd, kind, name]]); setNd(''); setName(''); }}>加入</button></div>
    ${list.length === 0 ? html`<div class="sub">${+year - 1911}年還沒有設定假日</div>` : html`<table class="grid"><thead><tr><th>日期</th><th>星期</th><th>類型</th><th>說明</th><th></th></tr></thead>
      <tbody>${list.map(h => html`<tr><td>${roc(h.date)}</td><td>${WDN[new Date(h.date + 'T00:00:00').getDay()]}</td>
        <td><span class=${'tag ' + (h.kind === '補班' ? 't-org' : h.kind === '颱風假' ? 't-new' : 't-ev')}>${h.kind}</span></td><td>${h.name}</td>
        <td><${ConfirmBtn} label="刪除" onYes=${() => del(h)} /></td></tr>`)}</tbody></table>`}
  </div>`;
}

// ================= 主畫面 =================
function Login({ onDone }) {
  const [pw, setPw] = useState(''), [msg, setMsg] = useState('請輸入團隊共用密碼'), [busy, setBusy] = useState(false);
  const go = async () => { if (!pw) return; setBusy(true); try { await signIn(pw); onDone(); } catch (e) { setMsg(e.message || '登入失敗'); } setBusy(false); };
  if (!CONFIGURED) return html`<div class="gate"><div class="box"><div style="font-size:18px;font-weight:700;color:var(--green)">雲端資料庫</div>
    <div class="sub" style="margin-top:8px;line-height:1.7">尚未設定資料庫。<br/>請在 eval.html 裡把 EVAL_URL 換成新 Convex 專案的網址。</div></div></div>`;
  return html`<div class="gate"><div class="box">
    <div style="font-size:18px;font-weight:700;color:var(--green)">雲端資料庫</div>
    <div class="sub" style="margin-top:6px">${msg}</div>
    <input type="password" value=${pw} onInput=${e => setPw(e.target.value)} onKeyDown=${e => e.key === 'Enter' && go()} placeholder="密碼" />
    <button class="btn" disabled=${busy} onClick=${go}>${busy ? '登入中…' : '登入'}</button></div></div>`;
}

function App() {
  const [authed, setAuthed] = useState(false), [checking, setChecking] = useState(true);
  const [user, setUser] = useState(() => { try { return localStorage.getItem('caUserName') || ''; } catch (e) { return ''; } });
  const [tab, setTab] = useState('summary'), [month, setMonth] = useState(todayMonth());
  const [db, setDb] = useState(null), [loading, setLoading] = useState(false), [toastMsg, setToastMsg] = useState(null);
  toastFn = (msg, err) => { setToastMsg({ msg, err }); setTimeout(() => setToastMsg(null), err ? 6000 : 2500); };

  const refresh = async () => {
    setLoading(true);
    try { await syncAll(); setDb(buildDb()); }
    catch (e) { console.error(e); toast('同步失敗：' + (e.message || e), true); }
    setLoading(false);
  };
  useEffect(() => { (async () => {
    if (CONFIGURED && conn.hasSaved() && await conn.fetchToken({ forceRefreshToken: false })) setAuthed(true);
    setChecking(false);
  })(); }, []);
  useEffect(() => { if (!authed) return; (async () => { await loadCache(); if (store.since.cases) setDb(buildDb()); await refresh(); })(); }, [authed]);
  // 切回這個分頁時，抓別人剛改過的資料（只抓變動的部分）
  useEffect(() => {
    if (!authed) return;
    const f = () => { if (document.visibilityState === 'visible') refresh(); };
    document.addEventListener('visibilitychange', f);
    const t = setInterval(f, 5 * 60 * 1000);
    return () => { document.removeEventListener('visibilitychange', f); clearInterval(t); };
  }, [authed]);
  const logout = async () => { try { localStorage.removeItem(REFRESH_KEY); } catch (e) { } await IDB.clear(); location.reload(); };

  if (checking) return html`<div class="empty">載入中…</div>`;
  if (!authed) return html`<${Login} onDone=${() => setAuthed(true)} />`;
  if (!user) return html`<div class="gate"><div class="box"><div style="font-weight:700;color:var(--green)">你是哪一位？</div>
    <div class="sub" style="margin-top:6px">修改紀錄會記下這個名字</div>
    <input id="nm" placeholder="請輸入你的名字" onKeyDown=${e => { if (e.key === 'Enter' && e.target.value.trim()) { localStorage.setItem('caUserName', e.target.value.trim()); setUser(e.target.value.trim()); } }} />
    <button class="btn" onClick=${() => { const v = document.getElementById('nm').value.trim(); if (v) { localStorage.setItem('caUserName', v); setUser(v); } }}>確定</button></div></div>`;

  const TABS = [['summary', '總表'], ['report', '評鑑報表'], ['stats', '統計'], ['import', '匯入'], ['settings', '設定']];
  return html`<div>
    <div class="top">
      <span class="brand">雲端資料庫<a href=${PORTAL_URL}>← 回入口網頁</a></span>
      ${TABS.map(([k, l]) => html`<button class=${'tabbtn' + (tab === k ? ' on' : '')} onClick=${() => setTab(k)}>${l}</button>`)}
      <span class="grow"></span>
      <label class="sub">月份 <input class="inp" type="month" value=${month} onChange=${e => e.target.value && setMonth(e.target.value)} /></label>
      <button class="btn light" disabled=${loading} onClick=${refresh}>${loading ? '同步中…' : '重新整理'}</button>
      <span class="sub">${user}</span><button class="btn sm gray" onClick=${logout} title="登出並清除這台電腦的暫存資料">登出</button>
    </div>
    ${!db ? html`<div class="empty">第一次開啟，正在下載資料…</div>`
      : tab === 'summary' ? html`<${SummaryView} db=${db} month=${month} user=${user} refresh=${refresh} />`
      : tab === 'report' ? html`<${ReportView} db=${db} month=${month} user=${user} refresh=${refresh} />`
      : tab === 'stats' ? html`<${StatsView} db=${db} month=${month} />`
      : tab === 'import' ? html`<${ImportView} db=${db} month=${month} user=${user} refresh=${refresh} />`
      : html`<div class="page"><${HolidaysCard} db=${db} user=${user} refresh=${refresh} /><${UnitsCard} db=${db} user=${user} refresh=${refresh} /></div>`}
    ${toastMsg && html`<div class="toast" style=${'background:' + (toastMsg.err ? 'var(--red)' : 'var(--green)')}>${toastMsg.msg}</div>`}
  </div>`;
}
render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
