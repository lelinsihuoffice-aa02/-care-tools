<style>
  :root{--bg:#faf6f0;--card:#fff;--line:#E4D5BE;--ink:#3d3529;--sub:#8C8071;--green:#7C9473;--soft:#E3EADD;
    --red:#dc2626;--redbg:#fee2e2;--org:#b45309;--orgbg:#fef3c7;--blue:#1d4ed8;--bluebg:#dbeafe;--ok:#15803d;--okbg:#dcfce7}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:14px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  @media (hover:none) and (pointer:coarse){input,select,textarea{font-size:16px}}
  #app{zoom:var(--z, 1)}
  .top{background:#efe6da;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .brand{font-weight:700;font-size:15px;margin-right:6px;display:flex;align-items:center;gap:8px}
  .brand img{width:30px;height:30px;object-fit:contain}
  .gate .logo{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 10px}
  .brand a{color:var(--sub);font-weight:400;font-size:12px;margin-left:8px;text-decoration:none}
  .tabbtn{border:none;background:transparent;padding:8px 12px;border-radius:10px;color:#5a4a3a}
  .tabbtn.on{background:rgba(124,148,115,.2);color:var(--green);font-weight:700}
  .grow{flex:1}
  .inp{padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
  .inp.bad{border-color:var(--red);background:var(--redbg)}
  .btn{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:10px;font-weight:500;white-space:nowrap}
  .btn.gray{background:#A69C8E}.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.red{background:var(--red)}.btn.sm{padding:4px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .page{padding:14px 14px 110px;max-width:1600px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  h2{margin:0 0 4px;font-size:19px} h3{margin:0 0 10px;font-size:15px}
  .sub{color:var(--sub);font-size:12px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600;white-space:nowrap}
  .t-new{background:var(--bluebg);color:var(--blue)}.t-close{background:#f1f5f9;color:#64748b}.t-ev{background:var(--soft);color:var(--green)}
  .t-warn{background:var(--redbg);color:var(--red)}.t-ok{background:var(--okbg);color:var(--ok)}.t-org{background:var(--orgbg);color:var(--org)}
  .tw{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:calc((100vh - 210px) / var(--z, 1));background:#fff}
  table.grid{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
  .grid th{position:sticky;top:0;background:#f4ede3;font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
  .grid td{padding:6px 8px;border-bottom:1px solid #f0e8dc;white-space:nowrap;vertical-align:middle}
  .grid tr.click:hover td{background:#FBF3E6;cursor:pointer}
  .grid td.num{text-align:right;font-variant-numeric:tabular-nums}
  .grid tr.curmonth td{background:#fff3c4;font-weight:700;border-top:2px solid #e8b931;border-bottom:2px solid #e8b931}
  .grid th.num{text-align:right}
  .cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px}
  @media (max-width:900px){.cols2{grid-template-columns:minmax(0,1fr)}}
  .grid td.flag{background:var(--redbg);color:var(--red);font-weight:700}
  .grid td.need{background:#fff7ed}
  .grid td .inp{padding:4px 8px;border-radius:8px;font-size:13px}
  .grid th .hint{font-weight:400;color:var(--sub);font-size:11px;display:block}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .chip b{display:block;font-size:18px;color:var(--green)}
  .modal{position:fixed;inset:0;background:rgba(61,53,41,.35);z-index:100;display:flex;justify-content:flex-end}
  .drawer{background:var(--bg);width:min(980px,100%);height:100%;overflow:auto;padding:16px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 12px}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
  .form label .inp{color:var(--ink)}
  .form label .ampm{align-self:flex-start}
  .sect{font-weight:700;color:var(--green);margin:16px 0 8px}
  .choice{display:flex;gap:10px;flex-wrap:wrap}
  .choice button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 18px;font-size:15px;font-weight:700;color:var(--ink);text-align:left;min-width:180px}
  .choice button span{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
  .choice button.on{border-color:var(--green);background:var(--soft);color:var(--green)}
  .choice button:hover:not(.on){background:#FBF3E6}
  .picks{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-width:520px}
  .picks button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;text-align:left;font-size:13px}
  .picks button:hover{background:#FBF3E6;border-color:var(--green)}
  .numlink{border:none;background:none;padding:2px 6px;border-radius:6px;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted #c9b896;text-underline-offset:3px}
  .numlink:hover{background:var(--soft)}
  .numlink.on{background:var(--green);color:#fff;text-decoration:none}
  .fstats{position:fixed;right:16px;bottom:16px;z-index:900;display:flex;gap:10px}
  .fstats button{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
  .fstats button span{font-size:11px;color:var(--sub);line-height:1.2}
  .fstats button b{font-size:19px;color:var(--green);line-height:1.2}
  .fstats button:hover{background:#FBF3E6}
  .fstats button.on{background:var(--green);border-color:var(--green)}.fstats button.on span,.fstats button.on b{color:#fff}
  .fpanel{position:fixed;right:16px;bottom:96px;z-index:900;width:min(760px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  @media (max-width:700px){.fstats{gap:6px}.fstats button{width:56px;height:56px}.fstats button b{font-size:16px}.fstats button span{font-size:10px}}
  .trigbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .trigbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}
  .trigbar button b{margin-left:6px;color:var(--green)}

  <button id="fzDown" aria-label="縮小字體">A−</button>

<script>
(function(){
  var KEY = 'evalZoom', DEF = 1, MIN = 0.8, MAX = 1.6, STEP = 0.1, z = DEF;
  try{ var v = parseFloat(localStorage.getItem(KEY)); if(v >= MIN && v <= MAX) z = v; }catch(e){}
  function apply(){
    z = Math.round(Math.min(MAX, Math.max(MIN, z)) * 100) / 100;
    document.documentElement.style.setProperty('--z', z);
    document.getElementById('fzLv').textContent = Math.round(z * 100) + '%';
    try{ localStorage.setItem(KEY, z); }catch(e){}
  }
  document.getElementById('fzDown').onclick = function(){ z -= STEP; apply(); };
  document.getElementById('fzUp').onclick = function(){ z += STEP; apply(); };
  document.getElementById('fzLv').onclick = function(){ z = DEF; apply(); };
  apply();
})();
</script>

// ================= CORE-START（純邏輯：日期、時效、報表；不碰畫面與資料庫） =================
const pad = n => String(n).padStart(2, '0');
const WDN = ['日', '一', '二', '三', '四', '五', '六'];

// ---------- 日期 ----------
// 一律存成西元 'YYYY-MM-DD'；接受民國 115/10/12、115.10.12、1151012、115年10月12日、西元、Excel 日期序號
function parseDate(x) {
  if (x === null || x === undefined || x === '') return '';
  if (x instanceof Date && !isNaN(x)) return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
  if (typeof x === 'number') {
    if (x > 20000 && x < 80000) { // Excel 序號
      const d = new Date(Date.UTC(1899, 11, 30) + x * 86400000);
      return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    }
    x = String(x);
  }
  let s = String(x).trim().replace(/[年月.\-－／\s]/g, '/').replace(/日/g, '').replace(/\/+/g, '/').replace(/\/$/, '');
  let y, m, d, mm;
  if ((mm = s.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = s.match(/^(\d{3})(\d{2})(\d{2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = s.match(/^(\d{4})(\d{2})(\d{2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else return '';
  if (y < 1000) y += 1911;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return '';
  return `${y}-${pad(m)}-${pad(d)}`;
}
const toUTC = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fromUTC = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (iso, n) => fromUTC(toUTC(iso) + n * 86400000);
const calDays = (a, b) => (a && b) ? Math.round((toUTC(b) - toUTC(a)) / 86400000) : null;
const weekday = iso => new Date(toUTC(iso)).getUTCDay();
function addMonths(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(Math.min(d, last))}`;
}
// 民國顯示
function roc(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${+y - 1911}/${m}/${d}`; }
function rocMonth(mk) { const [y, m] = mk.split('-'); return `${+y - 1911}年${+m}月`; }
const monthOf = iso => iso ? iso.slice(0, 7) : '';
function shiftMonth(mk, n) { return addMonths(mk + '-01', n).slice(0, 7); }

// ---------- 工作天 ----------
// holidays：{ 'YYYY-MM-DD': '假日' | '颱風假' | '補班' }
function isWorkday(iso, holidays) {
  const k = holidays[iso];
  if (k === '補班') return true;
  if (k) return false;
  const w = weekday(iso);
  return w !== 0 && w !== 6;
}
// 起算日當天不算，從隔天數到截止日（含）。截止日早於起算日時回傳負數。
function workDays(a, b, holidays) {
  if (!a || !b) return null;
  if (a === b) return 0;
  const sign = b > a ? 1 : -1;
  let [from, to] = sign > 0 ? [a, b] : [b, a];
  let n = 0, d = addDays(from, 1);
  for (let guard = 0; d <= to && guard < 4000; guard++, d = addDays(d, 1)) if (isWorkday(d, holidays)) n++;
  return n * sign;

// 兩日期相差的「月+天」文字，以及是否超過 n 個月（期限 = 起算日加 n 個月的同一日）
function monthSpan(a, b) {
  if (!a || !b) return '';
  let months = 0;
  while (addMonths(a, months + 1) <= b) months++;
  const days = calDays(addMonths(a, months), b);
  return (months ? `${months}個月` : '') + (days || !months ? `${days}天` : '');
}
const overMonths = (a, b, n) => !!(a && b && b > addMonths(a, n));

// ---------- 時間（HH:MM） ----------
// 接受 10:30、1030、10點30、上午10點、下午3:00、Excel 時間小數
function parseTime(x) {
  if (x === null || x === undefined || x === '') return '';
  if (typeof x === 'number') {
    const f = x % 1; if (!f) return '';
    const m = Math.round(f * 1440); return `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
  }
  let s = String(x).trim().replace(/：/g, ':').replace(/\s+/g, '');
  const pm = /下午|晚上|PM/i.test(s), am = /上午|早上|凌晨|AM/i.test(s);
  s = s.replace(/上午|下午|早上|晚上|凌晨|AM|PM/gi, '');
  let mm = s.match(/(\d{1,2})[:點時](\d{1,2})?分?$/) || s.match(/^(\d{1,2})(\d{2})$/) || s.match(/^(\d{1,2})$/);
  if (!mm) return '';
  let h = +mm[1], mi = +(mm[2] || 0);
  if (pm && h < 12) h += 12;

  return `${pad(h)}:${pad(mi)}`;

function timeFromText(x) {
  if (typeof x === 'number') return parseTime(x);
  const m = String(x || '').trim().match(/^\S+?(?:\s+|(?=上午|下午|早上|晚上))(.+)$/);
  return m ? parseTime(m[1]) : '';
}
// 中午 12 點分界的工作天：每個「天」是前一個工作天中午 12 點到當天中午 12 點。
// 起點那一段算第 1 天。例：10/14 10:00 審核 → 10/14 12:00 前完成是第 1 天，10/14 12:00～10/15 12:00 是第 2 天。
// 週末、國定假日、颱風假不算；12:00 整點算下一天。沒填時間時當作上午。
// 上午／下午：存「上午」或「下午」；舊資料或匯入的 HH:MM 也看得懂
const AMPM = ['上午', '下午'];
const isPM = t => t === '下午' || (/^\d{2}:\d{2}$/.test(t || '') && t >= '12:00');
const toAmPm = t => !t ? '' : AMPM.includes(t) ? t : isPM(t) ? '下午' : '上午';
function noonWindow(date, time, H) {
  if (isWorkday(date, H) && !isPM(time)) return date;
  let d = addDays(date, 1);

function noonDays(d1, t1, d2, t2, H) {
  if (!d1 || !d2) return null;
  const a = noonWindow(d1, t1, H), b = noonWindow(d2, t2, H);
  if (b < a) return workDays(a, b, H);   // 順序錯誤，回傳負數
  return workDays(a, b, H) + 1;
}

  '新案-重開案-初評', '新案-重開案-出備', '新案-重開案-AA01', '新案-重開案-複評', '新案-重開案-AA02',
  '複評', 'AA01', '上月新案-初評', '上月新案-出備', '上月沒吃到錢', '結案-', '結案400-', '上月結案'];
// 統一寫法：去空白、全形符號轉半形、「轉入AA01」補上 -
function normTrigger(t) {
  let s = String(t || '').replace(/\s+/g, '').replace(/[－—–]/g, '-').replace(/ＡＡ/g, 'AA').toUpperCase().replace(/^新案-轉入(?!-)/, '新案-轉入-');
  if (/^-*$/.test(s)) return '';   // 「-」代表本月沒有觸發
  return s;
}
const isNewTrigger = t => { t = normTrigger(t); return t.startsWith('新案') || t === '出轉初'; };
// 結案觸發：
//   「結案-」「結案400-」＝本月結案
//   「10月結案」「10月結案-」（有沒有 - 都一樣）＝10 月已結案、本月只是還留在總表
//   「上月結案」＝上個月
function closeMonthOf(t, evMonth) {
  t = normTrigger(t);
  let m = t.match(/^(\d{1,2})月結案/);
  if (m) {
    const n = +m[1], [y, em] = evMonth.split('-').map(Number);
    if (n < 1 || n > 12) return '';
    return `${n > em ? y - 1 : y}-${pad(n)}`;
  }
  if (t.startsWith('上月結案')) return shiftMonth(evMonth, -1);
  if (t.startsWith('結案')) return evMonth;
  if (/\/\s*結案/.test(t)) return evMonth;   // 「複評-1700/結案-」這種：同一個月複評又結案
  return '';
}
const isCloseTrigger = t => /^((\d{1,2}月)|上月)?結案/.test(normTrigger(t));

// ---------- 地區 ----------
const REGIONS = { '04': '四湖', '05': '台西', '06': '麥寮', '07': '東勢' };
// 編號整理：去空白、全形數字與各種破折號（－ — – ‐ ─）都換成半形「-」
function normCaseNo(v) {
  return String(v ?? '').replace(/\s/g, '').replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/[－—–‐‑─ー_]/g, '-').replace(/-+/g, '-');
}
function parseCaseNo(no) {
  const m = String(no || '').replace(/\s/g, '').match(/^(.+?)-(\d{2})-(\d+)-(\d+)$/);
  if (!m) return null;
  return { prefix: m[1], region: m[2], seq: +m[3], reopen: +m[4] };
}
const regionOf = no => { const p = parseCaseNo(no); return p ? (REGIONS[p.region] || p.region) : '未知'; };

const normName = s => String(s || '').replace(/[\s ]/g, '').replace(/⾧/g, '長').replace(/^雲林縣-/, '').replace(/（/g, '(').replace(/）/g, ')');
// units：[{ name, short, aliases:[] }]；回傳統一後的顯示名稱（有簡稱用簡稱）
function makeUnitResolver(units) {
  const exact = new Map(), list = [];
  for (const u of units) {
    const show = u.short || u.name;
    for (const n of [u.name, u.short, ...(u.aliases || [])]) if (n) exact.set(normName(n), show);
    if (u.short) list.push([normName(u.short), show]);
  }
  return raw => {
    const n = normName(raw);
    if (!n) return '';
    if (exact.has(n)) return exact.get(n);
    const hit = list.find(([s]) => n.includes(s) || s.includes(n));
    return hit ? hit[1] : String(raw).trim();
  };
}

    const all = pick([...new Set(Object.values(KNOWN_UNITS).flat())]);
    if (!hit.length && all.length === 1) return all[0];
  }
  return n;
}

// 總表顯示用簡稱：打簡稱就照打的；打全名就換成簡稱（例如紅十字「東勢社區」寫在居服單位 → 紅十字）
const SHORT_FIXED = { [LELING_FULL]: '樂臨', [LELING_CO]: '樂臨', '樂臨企業有限公司附設雲林縣私立樂臨社區式長照機構': '樂臨', '樂臨居家護理所': '樂臨居家護理所',
  [RC_HOME]: '紅十字', [RC_ASSOC]: '紅十字', [RC_DONGSHI]: '東勢紅十字', [RC_TAIXI]: '台西紅會', [AIDS_CENTER]: '輔具中心' };
function unitShort(raw, catKey, units) {
  const t = String(raw || '').trim(); if (!t || !isUnitName(t) || normName(t).length <= 8) return t;
  const full = canonUnit(t, (CAT[catKey] || {}).stat || 'B單位', units, []);
  if (SHORT_FIXED[full]) return SHORT_FIXED[full];
  const u = (units || []).find(x => x.short && normName(x.name) === full); if (u) return u.short;
  const m = full.split('私立').pop().replace(/^雲林縣/, '').replace(/(居家式服務類長期照顧服務機構|社區式服務類長期照顧服務機構|居家式服務類長照機構|居家式長期照顧服務機構|長期健康管理居家式照顧機構|小規模多機能.*|居家式長照機構|社區式長照機構|綜合長照機構|居家長照機構|社區長照機構|老人長期照顧中心.*|老人養護中心|居家護理所|居家職能治療所|護理之家|老學堂)$/, '');
  return m && m.length <= 8 ? m : t;
}

// 總表裡寫成全名的服務單位 → 改存成簡稱（只改認得的全名；簡稱、「僅日照」這類文字不動）
function fullToShortChanges(db) {
  const allKnown = new Set([...Object.values(KNOWN_UNITS).flat(), ...(db.units || []).map(u => normName(u.name))]);
  const conv = (raw, k) => {
    const t = String(raw || '').trim(); if (!t || !isUnitName(t) || normName(t).length <= 8) return null;
    const full = canonUnit(t, (CAT[k] || CAT.home).stat, db.units, []);
    if (!allKnown.has(full)) return null;
    const sh = unitShort(t, k, db.units);
    return sh && sh !== t && sh.length < t.length ? sh : null;
  };
  const cases = [], events = [];
  for (const c of db.cases.values()) { const p = {}; for (const [k, v] of Object.entries(c.services || {})) { const sh = conv(v, k); if (sh) p[k] = [v, sh]; } if (Object.keys(p).length) cases.push({ c, p }); }
  for (const e of db.events) { if (!db.cases.has(e.caseId)) continue; const p = {}; for (const [k, v] of Object.entries(e.services || {})) { const sh = conv(v, k); if (sh) p[k] = [v, sh]; } if (Object.keys(p).length) events.push({ e, p }); }
  return { cases, events };
}

function avg(rows, f) {

}
function rate(rows, f, ok) {
  const xs = rows.map(f).filter(x => typeof x === 'number');

}

// db：{ cases: Map(id→case), events: [event], holidays: {date→kind}, resolveUnit }
// 事件 event = { _id, caseId, month, ...欄位 }；個案 case = { _id, caseNo, ...欄位 }
function buildReport(key, month, db) {
  const R = REPORTS[key];
  const evs = db.events.filter(e => e.month === month && R.filter(e) && db.cases.has(e.caseId));
  evs.sort((a, b) => String(db.cases.get(a.caseId).caseNo).localeCompare(String(db.cases.get(b.caseId).caseNo), 'zh-Hant', { numeric: true }));
  const ctx = {
    prevVisit(caseId, mk, before) {
      let best = '';
      for (const e of db.events) if (e.caseId === caseId && e.month < mk && e.visit && (!before || e.visit < before) && e.visit > best) best = e.visit;
      return best;
    },
  };
  const rows = evs.map((e, idx) => {
    const c = db.cases.get(e.caseId);
    const svc = {};
    Object.assign(svc, caseUnits(e, c, db.resolveUnit));
    const r = { i: idx + 1, e, c, caseId: e.caseId, month, svc };
    // B單位第一次提供服務日期：個案視窗填的「B單位第一次提供服務日期（居服進場）」。
    // 可能填在新案那個月、也可能填在之後的月份 → 取新案月份（含）以後最早有填的；都沒有再看個案的居服進場日期
    let bf = '';
    for (const x of db.events) if (x.caseId === e.caseId && x.month >= month && x.bFirst && (!bf || x.bFirst < bf)) bf = x.bFirst;
    if (!bf && c.homeStart && c.homeStart >= (e.assess || e.referA || month + '-01').slice(0, 7) + '-01') bf = c.homeStart;
    r.bFirstAuto = bf;
    r.k = R.calc(r, db.holidays, ctx);
    return r;
  });
  return { R, rows, summary: R.summary(rows) };
}
// 報表某一格的顯示文字（畫面與匯出共用）
// 指定／輪派 → 報表的選項文字

// B單位的派案機制：先看居家（B單位），沒有就看第一個有填的服務項目
function bMechOf(c) {
  const m = (c && c.svcMech) || {};
  if (m.home) return m.home;
  const k = CATS.find(x => m[x.key]); return k ? m[k.key] : '';
}
const editVal = (col, r) => (r.e[col.edit] || (col.fallback ? col.fallback(r) : '') || '');
function cellText(col, r) {
  const val = col.edit ? editVal(col, r) : col.v(r);
  if (val === null || val === undefined) return '';
  if (col.date || col.type === 'date') return roc(val);
  if (col.hide && col.hide(r)) return '';
  if (col.opts === AMPM) return toAmPm(val);

// ---------- 評鑑報表的舊資料（匯入） ----------
// 欄名比對用：去空白、去括號內容、只取第一行（說明文字不算）、去掉「平均天數」等字
const normCol = h => String(h || '').split(/\n/)[0].replace(/\s+/g, '').replace(/[（(].*?[)）]/g, '').replace(/平均天數/g, '').replace(/日期$/, '').replace(/身分證字號/, '身分證號');
const COL_ALIAS = { '個案出院至訪視': '出院至訪視', '訪視日期至計畫通過': '訪視至計畫通過', '個管照會B單位': '個管照會B單位' };
function colMatch(ours, theirs) {
  let a = normCol(ours), b = normCol(theirs); b = COL_ALIAS[b] || b;
  return a === b || (a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a)));
}
// 從工作表名稱或標題列找出月份（115年10月、10月）
function sheetMonth(name, aoa, fallbackYear) {
  const txt = [name, ...(aoa.slice(0, 2).flat())].map(x => String(x || '')).join(' ');
  let m = txt.match(/(\d{3})\s*年\s*(\d{1,2})\s*月/);
  if (m) return `${+m[1] + 1911}-${pad(+m[2])}`;
  m = String(name).match(/^(\d{1,2})\s*月?$/);
  if (m && fallbackYear) return `${fallbackYear}-${pad(+m[1])}`;
  return '';
}
// 讀一份評鑑報表 Excel（一個月一張工作表）→ { 'YYYY-MM': { head:[欄名], rows:[[值]] } }
function parseReportBook(sheets, fallbackYear) {
  const out = {};
  for (const [name, aoa] of Object.entries(sheets)) {
    const hr = aoa.findIndex(r => r && r.some(x => /^姓名$/.test(String(x || '').trim())));
    if (hr < 0) continue;
    const mk = sheetMonth(name, aoa, fallbackYear); if (!mk) continue;
    const head = aoa[hr].map(x => String(x || '').trim());
    const rows = [];
    for (let i = hr + 1; i < aoa.length; i++) {
      const r = aoa[i] || [];
      const nameCol = head.findIndex(h => h === '姓名'), idCol = head.findIndex(h => /身分證/.test(h));
      if (!String(r[nameCol] ?? '').trim() && !String(r[idCol] ?? '').trim()) continue;
      rows.push(head.map((h, j) => {
        let v = r[j]; if (v === undefined || v === null) return '';
        if (typeof v === 'number' && v > 20000 && v < 80000 && /日期|時間|日$/.test(h.split(/\n/)[0])) return roc(parseDate(v));
        return typeof v === 'number' ? v : String(v).trim();
      }));
    }
    out[mk] = { head, rows };
  }
  return out;
}
// 把舊資料的一列對到系統報表的欄位
function histRowFor(R, hist, row) {
  return R.cols.map(c => {
    if (c.opts === AMPM) return '';                      // 舊表沒有上下午欄
    let j = hist.head.findIndex(h => { const b = normCol(h); return normCol(c.h) === (COL_ALIAS[b] || b); });
    if (j < 0) j = hist.head.findIndex(h => colMatch(c.h, h));
    return j < 0 ? '' : row[j];
  });
}

// ---------- 服務單位統計 ----------
// kind：'new' 新案 / 'reassess' 複評；回傳 { [類別key]: { [單位]: 件數 } }
// 總表服務欄位裡不是單位名稱的寫法（僅交通、僅日照、無、-…）
const NOT_UNIT = /^(僅|只有|無$|-+$|\/$|暫停|待)/;
const isUnitName = v => { const s = String(v || '').replace(/\s+/g, ''); return !!s && !NOT_UNIT.test(s); };
// 「僅交通」「僅日照」→ 指向哪個服務類別
function onlyCatOf(v) {
  const s = String(v || '').replace(/\s+/g, '').replace(/^(僅|只有)/, '');
  if (!s || s === String(v || '').replace(/\s+/g, '')) return null;
  const alias = { 送餐: 'meal', 餐飲: 'meal', 營養餐飲: 'meal', 專業: 'prof', 復能: 'prof', 日照喘息: 'dayresp', 機構喘息: 'inst', 居家喘息: 'resp', 居家: 'home', 居服: 'home' };
  if (alias[s]) return alias[s];
  const hit = CATS.find(c => s === c.label || s === c.stat || s === c.col || s.startsWith(c.label));
  return hit ? hit.key : null;
}
// 一個個案在某個月各服務類別的單位（不是單位名稱的不算；「僅交通」但交通欄沒填 → 交通記「（未填單位）」）
function caseUnits(e, c, resolveUnit) {

    e.onList = true;

    rows.push({ caseNo, c, e, month, hasTrigger });

  const cnt = {}; for (const r of rows) cnt[r.caseNo] = (cnt[r.caseNo] || 0) + 1;

  const ser = `<c:ser><c:idx val="0"/><c:order val="0"/>${dl}<c:cat><c:strRef><c:f>${xmlEsc(ch.cat)}</c:f>${strCache}</c:strRef></c:cat><c:val><c:numRef><c:f>${xmlEsc(ch.val)}</c:f>${numCache}</c:numRef></c:val></c:ser>`;
  const plot = pie ? `<c:pieChart><c:varyColors val="1"/>${ser}<c:firstSliceAng val="0"/></c:pieChart>`
    : `<c:barChart><c:barDir val="col"/><c:grouping val="clustered"/><c:varyColors val="0"/>${ser}<c:gapWidth val="80"/><c:axId val="5001"/><c:axId val="5002"/></c:barChart>`
      + `<c:catAx><c:axId val="5001"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="b"/><c:numFmt formatCode="General" sourceLinked="0"/><c:tickLblPos val="nextTo"/><c:crossAx val="5002"/><c:crosses val="autoZero"/><c:auto val="1"/><c:lblAlgn val="ctr"/><c:lblOffset val="100"/><c:noMultiLvlLbl val="0"/></c:catAx>`
      + `<c:valAx><c:axId val="5002"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="l"/><c:majorGridlines/><c:numFmt formatCode="General" sourceLinked="1"/><c:tickLblPos val="nextTo"/><c:crossAx val="5001"/><c:crosses val="autoZero"/><c:crossBetween val="between"/></c:valAx>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<c:chartSpace xmlns:c="${C}" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><c:roundedCorners val="0"/><c:chart>`
    + `<c:title><c:tx><c:rich><a:bodyPr/><a:p><a:pPr><a:defRPr sz="1400" b="1"/></a:pPr><a:r><a:rPr lang="zh-TW" sz="1400" b="1"/><a:t>${xmlEsc(ch.title)}</a:t></a:r></a:p></c:rich></c:tx><c:overlay val="0"/></c:title>`
    + `<c:autoTitleDeleted val="0"/><c:plotArea><c:layout/>${plot}</c:plotArea>${pie ? '<c:legend><c:legendPos val="r"/><c:overlay val="0"/></c:legend>' : ''}<c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart></c:chartSpace>`;
}
function drawingXml(charts) {
  const a = (tag, [c, r]) => `<xdr:${tag}><xdr:col>${c}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${r}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:${tag}>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">`
    + charts.map((ch, i) => `<xdr:twoCellAnchor>${a('from', ch.from)}${a('to', ch.to)}<xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="${i + 2}" name="圖表 ${i + 1}"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr><xdr:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></xdr:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="rId${i + 1}"/></a:graphicData></a:graphic></xdr:graphicFrame><xdr:clientData/></xdr:twoCellAnchor>`).join('')
    + `</xdr:wsDr>`;
}
// 把圖表塞進 SheetJS 產生的 xlsx（zip 是 JSZip 物件；sheets[i].charts 對應 sheet{i+1}.xml）
async function addChartsToZip(zip, sheets) {
  let ctypes = await zip.file('[Content_Types].xml').async('string'), chartNo = 0, extra = '';
  for (let i = 0; i < sheets.length; i++) {
    const charts = sheets[i].charts || []; if (!charts.length) continue;
    const sp = `xl/worksheets/sheet${i + 1}.xml`, dn = i + 1;
    let sx = await zip.file(sp).async('string');
    if (!/xmlns:r=/.test(sx)) sx = sx.replace('<worksheet ', '<worksheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ');
    sx = sx.replace('</worksheet>', '<drawing r:id="rIdChartDrawing"/></worksheet>');
    zip.file(sp, sx);
    const relP = `xl/worksheets/_rels/sheet${i + 1}.xml.rels`, relF = zip.file(relP);
    const rel = `<Relationship Id="rIdChartDrawing" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${dn}.xml"/>`;
    zip.file(relP, relF ? (await relF.async('string')).replace('</Relationships>', rel + '</Relationships>')
      : `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rel}</Relationships>`);
    zip.file(`xl/drawings/drawing${dn}.xml`, drawingXml(charts));
    const drels = charts.map((ch, j) => { chartNo++; zip.file(`xl/charts/chart${chartNo}.xml`, chartXml(ch)); extra += `<Override PartName="/xl/charts/chart${chartNo}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>`;
      return `<Relationship Id="rId${j + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${chartNo}.xml"/>`; }).join('');
    zip.file(`xl/drawings/_rels/drawing${dn}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${drels}</Relationships>`);
    extra += `<Override PartName="/xl/drawings/drawing${dn}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`;
  }
  zip.file('[Content_Types].xml', ctypes.replace('</Types>', extra + '</Types>'));
  return zip;
}

// ================= Convex 連線與登入（與其他系統同一組團隊密碼） =================
const SHARED_EMAIL = 'team@careapp-aa02.local';
const CONFIGURED = !/請換成/.test(EVAL_URL);
const REFRESH_KEY = 'evalRefreshToken';
const conn = (() => {
  if (!CONFIGURED) return null;
  const client = new ConvexClient(EVAL_URL), http = new ConvexHttpClient(EVAL_URL);
  let token = null, inFlight = null, resolveReady;
  const ready = new Promise(r => { resolveReady = r; });
  async function fetchToken({ forceRefreshToken }) {
    if (!forceRefreshToken && token) return token;
    if (inFlight) return inFlight;
    let rt = null; try { rt = localStorage.getItem(REFRESH_KEY); } catch (e) { }
    if (!rt) return null;
    inFlight = (async () => {
      try {
        const r = await http.action('auth:signIn', { refreshToken: rt });
        if (r && r.tokens) { token = r.tokens.token; localStorage.setItem(REFRESH_KEY, r.tokens.refreshToken); resolveReady(); return token; }
      } catch (e) { console.error('[換 token 失敗]', e); }
      try { localStorage.removeItem(REFRESH_KEY); } catch (e) { }
      token = null; return null;
    })().finally(() => { inFlight = null; });
    return inFlight;
  }
  client.setAuth(fetchToken);
  async function signIn(pw, flow) {
    const r = await http.action('auth:signIn', { provider: 'password', params: { email: SHARED_EMAIL, password: pw, flow: flow || 'signIn' } });
    if (!r || !r.tokens) throw new Error('登入失敗');
    token = r.tokens.token; localStorage.setItem(REFRESH_KEY, r.tokens.refreshToken);
    client.setAuth(fetchToken); resolveReady();
  }
  const hasSaved = () => { try { return !!localStorage.getItem(REFRESH_KEY); } catch (e) { return false; } };
  return { client, ready, fetchToken, signIn, hasSaved };
})();
async function signIn(pw) {
  try { await conn.signIn(pw); }
  catch (e1) {
    // 新資料庫第一次使用時還沒有帳號，用這組密碼建立
    try { await conn.signIn(pw, 'signUp'); }
    catch (e2) { console.error(e1, e2); throw new Error('密碼錯誤，請再試一次'); }
  }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function call(kind, name, args) {
  await conn.ready;
  for (let i = 0; ; i++) {
    try { return kind === 'q' ? await conn.client.query(name, args || {}) : await conn.client.mutation(name, args || {}); }
    catch (e) { if (i < 5 && /未登入/.test(e.message || '')) { await sleep(1000); continue; } throw e; }
  }
}

// ================= 本機快取（IndexedDB）+ 增量同步 =================
// 第一次開啟會下載全部資料，之後只下載別人改過的部分，大幅節省 Convex 免費額度。
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('evalCache', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } },
  async set(k, v) { try { const db = await this.open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) { } },
  async clear() { try { const db = await this.open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').clear(); t.oncomplete = res; t.onerror = res; }); } catch (e) { } },
};
const TABLES = ['cases', 'events', 'units', 'holidays', 'closures', 'kv'];
const CACHE_KEY = 'cache:' + EVAL_URL;
const store = { rows: { cases: new Map(), events: new Map(), units: new Map(), holidays: new Map(), closures: new Map(), kv: new Map() }, since: { cases: 0, events: 0, units: 0, holidays: 0, closures: 0, kv: 0 } };
async function loadCache() {
  const c = await IDB.get(CACHE_KEY);
  if (!c) return;
  for (const t of TABLES) { store.rows[t] = new Map(((c.rows || {})[t] || []).map(x => [x._id, x])); store.since[t] = (c.since || {})[t] || 0; }
}
let syncing = null;
async function syncAll() {
  if (syncing) return syncing;
  syncing = (async () => {
    let changed = 0;
    for (const t of TABLES) {
      let cursor = null, max = store.since[t];
      for (; ;) {
        const r = await call('q', 'data:sync', { table: t, since: store.since[t], paginationOpts: { numItems: 500, cursor } });
        for (const x of r.page) {
          const old = store.rows[t].get(x._id);
          if (!old || old.updatedAt !== x.updatedAt || old.d !== x.d || old.deleted !== x.deleted) changed++;
          if (x.deleted) store.rows[t].delete(x._id); else store.rows[t].set(x._id, x);
          if (x.updatedAt > max) max = x.updatedAt;
        }
        if (r.isDone) break;
        cursor = r.continueCursor;
      }
      store.since[t] = max;
    }
    if (changed) await IDB.set(CACHE_KEY, { since: store.since, rows: Object.fromEntries(TABLES.map(t => [t, [...store.rows[t].values()]])) });
    return changed;
  })().finally(() => { syncing = null; });
  return syncing;
}
const J = s => { try { return JSON.parse(s); } catch (e) { return {}; } };
// 把快取轉成計算用的資料
function buildDb() {
  const cases = new Map();
  for (const x of store.rows.cases.values()) cases.set(x._id, { ...J(x.d), _id: x._id, caseNo: x.caseNo });
  const events = [...store.rows.events.values()].map(x => ({ ...J(x.d), _id: x._id, caseId: x.caseId, month: x.month }));
  // 舊版「請填全名」存成 aliases（沒有簡稱、只有一個服務類別）→ 當成統計表專用的對應，不影響總表與派案統計的顯示
  const units = [...store.rows.units.values()].map(x => ({ ...J(x.d), _id: x._id })).map(u => !u.short && (u.aliases || []).length && (u.cats || []).length === 1 && !u.statAliases
    ? { ...u, aliases: [], statOnly: true, statAliases: u.aliases.map(a => u.cats[0] + '|' + normName(a)) } : u);
  const holidays = {}, holidayList = [];
  for (const x of store.rows.holidays.values()) { const d = J(x.d); holidays[x.date] = d.kind || '假日'; holidayList.push({ ...d, _id: x._id, date: x.date }); }
  holidayList.sort((a, b) => a.date.localeCompare(b.date));
  const closures = [...store.rows.closures.values()].map(x => ({ ...J(x.d), _id: x._id, key: x.key }));
  const kv = {}; for (const x of store.rows.kv.values()) kv[x.key] = J(x.d);
  return { cases, events, units, holidays, holidayList, closures, kv, resolveUnit: makeUnitResolver(units), info: caseMonths({ cases, events }) };
}

// 日期輸入：輸入民國（115/10/12、1151012）或西元皆可，存成西元
function DateInput({ value, onChange, style, ph }) {
  const [txt, setTxt] = useState(roc(value)), [bad, setBad] = useState(false);
  useEffect(() => { setTxt(roc(value)); setBad(false); }, [value]);
  const commit = () => {
    const t = txt.trim();
    if (!t) { setBad(false); if (value) onChange(''); return; }
    const iso = parseDate(t);
    if (!iso) { setBad(true); return; }
    setBad(false); setTxt(roc(iso)); if (iso !== value) onChange(iso);
  };
  return html`<input class=${'inp' + (bad ? ' bad' : '')} style=${style || 'width:110px'} value=${txt} placeholder=${ph || '年/月/日'}
    title=${bad ? '日期格式不正確' : ''} onInput=${e => setTxt(e.target.value)} onBlur=${commit} onKeyDown=${e => e.key === 'Enter' && e.target.blur()} />`;
}

// 某月某報表用的舊資料（系統裡那個月沒有名單時才用）
const histOf = (db, key, month) => ((db.kv['report:' + key] || {}).months || {})[month] || null;
function reportAoa(key, month, db) {
  const { R, rows, summary } = buildReport(key, month, db);
  const head = R.cols.map(c => c.h), hist = !rows.length && histOf(db, key, month);
  const body = hist ? hist.rows.map(r => histRowFor(R, hist, r)) : rows.map(r => R.cols.map(c => cellText(c, r)));
  const aoa = [[`${ORG_TITLE}\n${rocMonth(month)}-${R.title}`], head, ...body];
  if (summary.length && !hist) { aoa.push([]); for (const [k, v] of summary) aoa.push([k, String(v)]); }
  return sheetFromAoa(aoa, R.cols.map(c => Math.max(8, Math.min(26, c.h.length * 2))), [{ s: { r: 0, c: 0 }, e: { r: 0, c: head.length - 1 } }]);
}
function exportReport(key, month, db, wholeYear) {
  const wb = XLSX.utils.book_new(), R = REPORTS[key];
  if (wholeYear) {
    const y = month.slice(0, 4);
    for (let m = 1; m <= 12; m++) XLSX.utils.book_append_sheet(wb, reportAoa(key, `${y}-${pad(m)}`, db), `${m}月`);
    XLSX.writeFile(wb, `${+y - 1911}年${R.title}.xlsx`);
  } else {
    XLSX.utils.book_append_sheet(wb, reportAoa(key, month, db), rocMonth(month));
    XLSX.writeFile(wb, `${rocMonth(month)}${R.title}.xlsx`);
  }
}

// ---- 編輯中的個案草稿：記在這台電腦（localStorage），網頁重新整理、切換分頁、登入過期、不小心關掉都還找得回來 ----
const DRAFT_KEY = 'caseDraft';
const readDraft = () => { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch { return null; } };
const writeDraft = d => { try { d ? localStorage.setItem(DRAFT_KEY, JSON.stringify(d)) : localStorage.removeItem(DRAFT_KEY); } catch { } };
function CaseEditor({ db, month, user, id, onClose, refresh, draft }) {
  // 新增時可能改成「沿用既有的重開案編號」，所以實際編輯的 id 用 state 記
  const [curId, setCurId] = useState(draft ? draft.curId : id || null);
  const orig = curId ? db.cases.get(curId) : null;
  const isAdd = !id;
  const [kind, setKind] = useState(draft ? draft.kind || '' : ''), [reopen, setReopen] = useState(draft ? draft.reopen || '' : ''), [rq, setRq] = useState(''), [reuseNote, setReuseNote] = useState('');
  const nextNo = rg => { let mx = 0; for (const c of db.cases.values()) { const p = parseCaseNo(c.caseNo); if (p && p.region === rg && p.seq > mx) mx = p.seq; } return `台-${rg}-${String(mx + 1).padStart(3, '0')}-1`; };
  const [caseNo, setCaseNo] = useState(draft ? draft.caseNo : orig ? orig.caseNo : '');
  const [c, setC] = useState(() => draft ? draft.c : ({ ...(orig || {}), services: { ...((orig || {}).services || {}) } }));
  // 居住地：依編號的地區自動帶入（台-05-… → 台西）
  useEffect(() => { const rg = regionOf(caseNo); if (rg && Object.values(REGIONS).includes(rg) && c.area !== rg && (!c.area || Object.values(REGIONS).includes(c.area))) setC(v => ({ ...v, area: rg })); }, [caseNo]);
  const [em, setEm] = useState(draft ? draft.em : month);
  const evOrig = useMemo(() => db.events.find(e => e.caseId === curId && e.month === em) || null, [db, curId, em]);
  const [ev, setEv] = useState(() => draft && draft.ev ? draft.ev : ({ ...(evOrig || {}), services: { ...((evOrig || {}).services || {}) } }));
  // 換月份才重新載入觸發紀錄。系統每 5 分鐘、或切回這個視窗時會自動更新資料：
  // 這時如果正在填（有改過），不要把填到一半的內容洗掉
  const evKey = `${curId}|${em}`, loaded = useRef({ key: evKey, ver: evOrig ? evOrig.updatedAt : 0, dirty: !!(draft && draft.evDirty) });
  useEffect(() => {
    const ver = evOrig ? evOrig.updatedAt : 0, L = loaded.current;
    if (L.key === evKey && (L.ver === ver || L.dirty)) return;
    loaded.current = { key: evKey, ver, dirty: false };
    setEv({ ...(evOrig || {}), services: { ...((evOrig || {}).services || {}) } });
  }, [evKey, evOrig]);
  const setEvDirty = v => { loaded.current.dirty = true; setEv(v); };
  const [busy, setBusy] = useState(false);
  const hist = useMemo(() => db.events.filter(e => e.caseId === curId).sort((a, b) => b.month.localeCompare(a.month)), [db, curId]);
  // 重開案：從系統裡找前幾個月的個案
  const matches = useMemo(() => {
    const t = rq.trim(); if (!t) return [];
    return [...db.cases.values()].filter(x => String(x.caseNo).includes(t) || String(x.name || '').includes(t) || String(x.idNo || '').toUpperCase().includes(t.toUpperCase())).sort(sortNo).slice(0, 8);
  }, [db, rq]);
  const pickReopen = src => {
    const no = String(src.caseNo).replace(/-\d+$/, '-2');
    const ex = [...db.cases.values()].find(x => x.caseNo === no);
    if (ex) {
      // 之前已重開過（編號尾數 2 不論重開幾次都一樣）→ 沿用那一筆，清除結案日期
      setCurId(ex._id); setC({ ...ex, aEnd: '', sysClose: '', services: { ...(ex.services || {}) } });
      setReuseNote(`編號 ${no} 之前已重開過，會沿用這一筆並清除結案日期`);
    } else {
      setCurId(null);
      const copy = {}; for (const k of BASE_COPY) if (src[k]) copy[k] = src[k];
      setC({ ...copy, services: {} }); setReuseNote(`已帶入 ${src.caseNo} 的基本資料`);
    }
    setCaseNo(no); setRq('');
  };
  const autoTrig = useMemo(() => curId ? autoTriggers(em, db).get(curId) || '' : '', [db, em, curId]);
  const chooseTrigger = t => {
    const nt = ev.trigger === t ? '' : t;
    setEvDirty({ ...ev, trigger: nt });

    else if (nt && !c.src) setC({ ...c, src: nt.includes('出備') ? '出備' : '初評' });
  };

  const diff = (a, b) => { const out = {}; for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) { if (k.startsWith('_') || k === 'caseId' || k === 'month' || k === 'caseNo') continue; if (JSON.stringify(a[k] ?? '') !== JSON.stringify(b[k] ?? '')) out[k] = b[k] ?? ''; } return out; };
  const save = async () => {
    if (isAdd && !kind) return toast('請先選擇新增方式', true);
    if (isAdd && kind === 'new' && !reopen) return toast('請選擇是否為重開案', true);
    if (isAdd && kind === 'new' && !ev.trigger) return toast('請選擇新案觸發', true);
    if (!caseNo.trim() || !parseCaseNo(caseNo)) return toast('編號格式應為 台-05-178-1', true);
    if (!String(c.name || '').trim()) return toast('請填寫姓名', true);
    if (ev.discharge && ev.visit && ev.visit <= ev.discharge) return toast('個管訪視日期必須晚於出院日期（出院當天不能訪視）', true);
    setBusy(true);
    try {
      let cid = curId;
      const cp = diff(orig || {}, c);

function ClosureEditor({ rec, user, refresh, onClose }) {

function ClosureImport({ db, user, refresh, onClose }) {

  const pick = async f => { if (!f) return; try { const w = XLSX.read(await f.arrayBuffer(), { type: 'array' }); setWb(w); setResult(null);

      ${st && html`<div class="chips"><div class="chip"><span class="sub">結案筆數</span><b>${st.total}</b></div>
        ${Object.values(REGIONS).map(r => html`<div class="chip"><span class="sub">${r}</span><b>${st.byReg[r] || 0}</b></div>`)}
        <div class="chip"><span class="sub">死亡</span><b>${parsed.rows.filter(r => isDeath(r.d.reason)).length}</b></div></div>
        <div class="sub" style="margin-bottom:10px">結案原因：${st.reasons.map(k => `${k} ${st.byReason[k]}`).join('、')}</div>

// 匯出結案報表：總表分析、結案總表、各區結案、各區死亡結案
function exportClosures(list, yr) {
  const wb = XLSX.utils.book_new(), regs = ['四湖', '台西', '麥寮', '東勢'];
  const head = ['姓名', '身分證號', 'A個管結案', '系統結案', '結案原因', '居住地', '服務代碼'];
  const rowOf = x => [x.name, x.idNo, roc(x.aEnd), roc(x.sysClose), x.reason, x.area, x.codes];
  const st = closureStats(list);
  const A = [['總地區', '總人數'], ...regs.map(r => [r, st.byReg[r] || 0]), ['總數', regs.reduce((a, r) => a + (st.byReg[r] || 0), 0)], [], [],
    ['總結案原因', '總人數'], ...st.reasons.map(k => [k, st.byReason[k]]), ['總人數', st.total]];
  for (const r of regs) {
    const o = st.cross[r] || {}, ks = st.reasons.filter(k => o[k]);
    A.push([], [], [r, '結案分析'], ['結案原因', '人數'], ...ks.map(k => [k, o[k]]), ['總人數', ks.reduce((a, k) => a + o[k], 0)]);
  }
  XLSX.utils.book_append_sheet(wb, sheetFromAoa(A, [20, 10]), '總表分析');
  XLSX.utils.book_append_sheet(wb, sheetFromAoa([head, ...list.map(rowOf)], [10, 13, 11, 11, 18, 8, 40]), '結案總表');
  for (const r of regs) {
    const mine = list.filter(x => x.area === r);
    XLSX.utils.book_append_sheet(wb, sheetFromAoa([head, ...mine.filter(x => !isDeath(x.reason)).map(rowOf)], [10, 13, 11, 11, 18, 8, 40]), `${r}-結案`);
    XLSX.utils.book_append_sheet(wb, sheetFromAoa([head, ...mine.filter(x => isDeath(x.reason)).map(rowOf)], [10, 13, 11, 11, 18, 8, 40]), `${r}-死亡結案`);
  }
  XLSX.writeFile(wb, `${yr ? (+yr - 1911) + '年' : ''}結案總表.xlsx`);
}

          ${rows.map(x => { const tot = x[0] === '總計'; return html`<tr class=${tot ? 'tot' : ''}><td>${tot ? html`<b>總計</b>` : x[0]}</td>

function StatReport({ db, month, user, refresh, rkey: key, picker }) {
  const y = month.slice(0, 4), yy = +y - 1911, kvKey = STAT_KV[key], hist = (db.kv[kvKey] || {}).months || {};
  const [busy, setBusy] = useState(false), [sheet, setSheet] = useState('在案+出備+新案');
  const months = Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`).filter(mk => mk <= todayMonth() || mk <= month);
  const hasSys = mk => db.events.some(e => e.month === mk);
  const srcOf = mk => hasSys(mk) ? '系統' : hist[mk] ? '匯入' : '';
  const strip = key !== 'statMonthly' && html`<div class="trigbar"><span class="sub">${yy}年各月：</span>${months.map(mk => { const s = srcOf(mk);
    return html`<span class=${'tag ' + (mk === month ? 't-warn' : s === '系統' ? 't-new' : s === '匯入' ? 't-close' : '')} style="padding:4px 8px">${+mk.slice(5)}月 ${s || '—'}</span>`; })}</div>`;
  const importOld = async f => {
    if (!f) return; setBusy(true);
    try {
      let got;
      if (key === 'statDispatch' || key === 'statCase') got = wordTablesByMonth(await readWordTables(await f.arrayBuffer()));
      else {
        const w = XLSX.read(await f.arrayBuffer(), { type: 'array' });
        const sheets = Object.fromEntries(w.SheetNames.map(n => [n, sheetAoa(w.Sheets[n])]));
        got = key === 'statAnnual' ? parseAnnualBook(sheets, y) : parseMonthSheets(sheets, y);
      }
      const ks = Object.keys(got).sort(); if (!ks.length) throw new Error('檔案裡找不到月份（標題或工作表名稱要有「115年1月」或「01月」）');
      await call('m', 'data:saveKv', { key: kvKey, d: JSON.stringify({ months: { ...hist, ...got } }), by: user });
      await refresh(); toast(`已匯入 ${ks.map(rocMonth).join('、')}`);
    } catch (e) { console.error(e); toast('匯入失敗：' + e.message, true); }
    setBusy(false);
  };
  const exportIt = async () => {
    setBusy(true);
    try {
      if (key === 'statDispatch' || key === 'statCase') {
        const blocks = months.map(mk => hasSys(mk) ? (key === 'statDispatch' ? dispatchBlock(dispatchStatMonth(mk, db)) : caseBlock(caseStatMonth(mk, db))) : hist[mk] ? histRowsToBlock(hist[mk]) : null).filter(Boolean);
        if (!blocks.length) throw new Error('今年還沒有資料');
        await buildWord(blocks, key === 'statDispatch' ? `1.${yy}年New新案統計-台西區.docx` : `3.${yy}年總人數統計-台西區.docx`);
      } else if (key === 'statCms') {
        const wb = XLSX.utils.book_new();
        for (const mk of months) XLSX.utils.book_append_sheet(wb, sheetFromAoa(fillRows(hasSys(mk) || !hist[mk] ? cmsSheetAoa(mk, db) : hist[mk]), [12, 8, 8, 8, 8, 8]), `${mk.slice(5)}月`);
        XLSX.writeFile(wb, `2.${yy}年New新案統計數據-台西區.xlsx`);
      } else if (key === 'statMonthly') {
        // 用原本的「4.115年10月圓餅圖-台西區.xlsx」當範本：框線、字型、欄寬、圖表樣式都照原檔，只換數字和名稱
        const spec = monthlyBookSpec(month, db), JSZip = (await import(JSZIP_URL)).default;
        const zip = await JSZip.loadAsync(Uint8Array.from(atob(MONTHLY_TPL), ch => ch.charCodeAt(0)));
        const files = {};
        for (const path of Object.keys(zip.files)) if (/\.xml$/.test(path) && !zip.files[path].dir) files[path] = await zip.file(path).async('string');
        for (const [path, xml] of Object.entries(fillMonthlyTemplate(files, spec))) zip.file(path, xml);
        downloadBlob(await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), spec.fileName);
      } else {
        const b = annualBook(y, db, hist, month > todayMonth() ? month : todayMonth()), wb = XLSX.utils.book_new();
        for (const [n, aoa] of Object.entries(b.sheets)) XLSX.utils.book_append_sheet(wb, sheetFromAoa(fillRows(aoa), Array(16).fill(10)), n);
        XLSX.writeFile(wb, `5.${yy}年數據統計-台西區.xlsx`);
      }
    } catch (e) { console.error(e); toast('匯出失敗：' + e.message, true); }
    setBusy(false);
  };
  // Excel 連線：把今年有系統資料的月份統計數字發布出去
  const publish = async () => {
    setBusy(true);
    try {
      const ms = months.filter(hasSys);
      for (const mk of ms) await call('m', 'data:saveKv', { key: 'pub:monthly:' + mk, d: JSON.stringify({ month: roc(mk + '-01').slice(0, -3), rows: publishRows(mk, db) }), by: user });
      await refresh(); toast(`已同步 ${ms.map(rocMonth).join('、') || '（今年沒有系統資料）'}到試算表連線`);
    } catch (e) { toast('更新失敗：' + e.message, true); }
    setBusy(false);
  };
  // 自動同步：打開月報時，今年各月數字有變動才寫入（沒變動不寫，省額度）→ Google 試算表 / Excel 跟系統圖表永遠同一份數字
  const syncing = useRef(false);
  useEffect(() => {
    if (key !== 'statMonthly' || syncing.current) return;
    const todo = months.filter(hasSys).map(mk => ({ mk, rows: publishRows(mk, db) }))
      .filter(({ mk, rows }) => JSON.stringify((db.kv['pub:monthly:' + mk] || {}).rows || null) !== JSON.stringify(rows));
    if (!todo.length) return;
    syncing.current = true;
    (async () => {
      try { for (const { mk, rows } of todo) await call('m', 'data:saveKv', { key: 'pub:monthly:' + mk, d: JSON.stringify({ month: roc(mk + '-01').slice(0, -3), rows }), by: user }); await refresh(); }
      catch (e) { console.error(e); }
      syncing.current = false;
    })();
  }, [db, key, y]);
  const desc = { statDispatch: '當月新案（新案-開頭）的派案單位、核定服務代碼數，以及指定／輪派名單', statCms: '當月新案的 CMS、身分福利別、性別、障礙等級', statCase: '當月各來源件數（依地區），以及新案、上月未吃到錢、結案名單', statMonthly: '當月新案、在案、結案、轉介樂臨、核銷，以及個案結構分析', statAnnual: '整年每月的新案、在案、出備、結案、性別、身分別、CMS、居住區域、障礙等級' }[key];
  let body;
  if (key === 'statDispatch' || key === 'statCase') {
    body = hasSys(month) ? (key === 'statDispatch' ? html`<${DispatchView} d=${dispatchStatMonth(month, db)} />` : html`<${CaseView} d=${caseStatMonth(month, db)} />`)
      : hist[month] ? html`<${SmartTables} aoa=${hist[month]} />` : html`<div class="card empty">${rocMonth(month)}沒有資料</div>`;
  } else if (key === 'statCms') body = html`<${SmartTables} aoa=${hasSys(month) || !hist[month] ? cmsSheetAoa(month, db) : hist[month]} />`;
  else if (key === 'statMonthly') body = hasSys(month) ? html`<${MonthlyView} month=${month} db=${db} />` : html`<div class="card empty">${rocMonth(month)}系統裡沒有總表資料</div>`;
  else { const b = annualBook(y, db, hist, month > todayMonth() ? month : todayMonth());
    body = html`<div class="trigbar">${Object.keys(b.sheets).map(n => html`<button class=${sheet === n ? 'on' : ''} onClick=${() => setSheet(n)}>${n}</button>`)}</div><${MonthBlocks} aoa=${b.sheets[sheet] || []} hl=${roc(month + '-01').slice(0, -3)} />`; }
  return html`<div class="page">
    <div class="bar">${picker}<span class="sub">${desc}</span><span class="grow"></span>
      ${kvKey && html`<label class="btn light" style="cursor:pointer">${busy ? '處理中…' : `匯入舊檔（${key === 'statDispatch' || key === 'statCase' ? 'Word' : 'Excel'}）`}<input type="file" accept=${key === 'statDispatch' || key === 'statCase' ? '.docx' : '.xlsx,.xls'} style="display:none" onChange=${e => { importOld(e.target.files[0]); e.target.value = ''; }} /></label>`}
      ${key === 'statMonthly' && html`<button class="btn light" disabled=${busy} onClick=${publish} title="打開月報時會自動同步；這個按鈕是手動再同步一次（只有數字，沒有個資）">立即同步試算表</button>`}
      <button class="btn" disabled=${busy} onClick=${exportIt}>${key === 'statMonthly' ? `匯出 4.${yy}年${month.slice(5)}月圓餅圖-台西區` : `匯出${yy}年${key === 'statDispatch' || key === 'statCase' ? ' Word' : ' Excel'}`}</button></div>
    ${strip}
    ${key !== 'statMonthly' && key !== 'statAnnual' && !hasSys(month) && hist[month] && html`<div class="sub" style="margin-bottom:8px"><span class="tag t-close">匯入的舊資料</span> ${rocMonth(month)}系統裡沒有資料，顯示匯入的舊檔內容。</div>`}
    ${body}
    ${key === 'statMonthly' && html`<div class="sub" style="margin-top:8px">Google 試算表／Excel：打開這頁時會自動同步今年各月數字，試算表那邊重新整理就會跟上面的圓餅圖一樣。${(() => { const n = Object.keys(db.kv).filter(k => k.startsWith('pub:monthly:')).sort(); return n.length ? `目前已發布：${n.map(k => rocMonth(k.slice(12))).join('、')}` : '目前還沒有發布過。'; })()}</div>`}
  </div>`;
}

function sheetAoa(ws) {
  if (!ws || !ws['!ref']) return [];
  let maxR = 0, maxC = 0;
  for (const k of Object.keys(ws)) {
    if (k[0] === '!') continue;
    const cell = ws[k]; if (!cell || cell.v === undefined || cell.v === null || cell.v === '') continue;
    const a = XLSX.utils.decode_cell(k); if (a.r > maxR) maxR = a.r; if (a.c > maxC) maxC = a.c;
  }
  const rg = XLSX.utils.decode_range(ws['!ref']);
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', range: { s: rg.s, e: { r: Math.min(rg.e.r, maxR), c: Math.min(rg.e.c, maxC) } } });
}
// 工作表名稱 → 月份：「115年10月」「115.10」「10月」「10月總表」「總表-10月」「1150」都認得；年份抓不到就看檔名，再不行用今年
function guessMonth(name, fileName = '') {
  const s = String(name).replace(/\s/g, ''), fy = String(fileName).match(/(\d{3})年/);
  let m = s.match(/(\d{3})[年.\-/]?(\d{1,2})月/) || s.match(/^(\d{3})[.\-/](\d{1,2})$/);
  if (m && +m[2] >= 1 && +m[2] <= 12) return `${+m[1] + 1911}-${pad(+m[2])}`;
  m = s.match(/(?:^|[^\d])(\d{1,2})月/) || s.match(/^(\d{1,2})$/);
  if (m && +m[1] >= 1 && +m[1] <= 12) return `${fy ? +fy[1] + 1911 : new Date().getFullYear()}-${pad(+m[1])}`;
  return '';
}
// 匯入時，比系統裡「已匯入的最新月份」還舊的月份：個案資料只補空白欄位，不蓋掉新的
function caseDForImport(row, existing, month) {
  const c = { ...row.c, importMonth: month };
  if (!existing || !existing.importMonth || existing.importMonth <= month) return c;
  const out = { importMonth: existing.importMonth, services: {} };
  for (const [k, v] of Object.entries(c)) {
    if (k === 'services') { for (const [sk, sv] of Object.entries(v || {})) if (!(existing.services || {})[sk]) out.services[sk] = sv; continue; }
    if (k === 'latest' || k === 'importMonth') continue;
    if (existing[k] === undefined || existing[k] === '' || existing[k] === null) out[k] = v;
  }
  return out;
}

  </div>`;
}

// ================= 誰在系統內 =================
// 每台電腦的瀏覽器一個代號；每分鐘回報一次「誰、在哪一頁、正在編輯哪個個案」，同時抓回線上名單
const CLIENT_ID = (() => { try { let x = localStorage.getItem('caClientId'); if (!x) { x = 'c' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('caClientId', x); } return x; } catch { return 'c' + Math.random().toString(36).slice(2, 12); } })();
const presence = { list: [], editing: null, subs: new Set() };
const setEditingCase = v => { presence.editing = v; window.dispatchEvent(new Event('ca-editing')); };
function usePresence() {
  const [, force] = useState(0);
  useEffect(() => { const f = () => force(n => n + 1); presence.subs.add(f); return () => presence.subs.delete(f); }, []);
  return presence.list;
}
const agoText = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? '剛剛' : m < 60 ? `${m} 分鐘前` : `${Math.floor(m / 60)} 小時前`; };
const PAGE_NAME = { summary: '總表', report: '評鑑報表', stats: '統計', import: '匯入', settings: '設定' };
// 上方顯示目前在線的人（頭貼＝名字第一個字）；正在編輯個案的人頭貼有橘色框和筆的小圖示，滑鼠移上去看是哪個個案
const AV_COLORS = ['#7c9473', '#c47a1c', '#5b8bb5', '#b56b8a', '#8a7bb5', '#4f9a94', '#b5874f', '#7a8a4f'];
const avColor = name => AV_COLORS[[...String(name)].reduce((a, ch) => a + ch.charCodeAt(0), 0) % AV_COLORS.length];
function OnlineAvatars() {
  const list = usePresence(), now = Date.now();
  const on = list.filter(p => p.lastSeen > now - 5 * 60 * 1000);
  // 同一個人開好幾個視窗只顯示一次（有在編輯的那個優先）
  const byName = new Map();
  for (const p of on) { const ex = byName.get(p.name); if (!ex || (!ex.caseLabel && p.caseLabel)) byName.set(p.name, { ...p, me: (ex && ex.me) || p.id === CLIENT_ID }); else if (p.id === CLIENT_ID) ex.me = true; }
  const people = [...byName.values()].sort((a, b) => (b.me ? 1 : 0) - (a.me ? 1 : 0) || a.since - b.since);
  if (!people.length) return null;
  return html`<span class="avatars" title="目前在線">${people.map(p => html`<span class=${'av' + (p.caseLabel ? ' editing' : '')} style=${'background:' + avColor(p.name)}
      title=${`${p.name}${p.me ? '（你）' : ''}・${PAGE_NAME[p.page] || p.page || ''}${p.caseLabel ? `・正在編輯 ${p.caseLabel}` : ''}`}>${[...p.name][0] || '?'}${p.caseLabel && html`<i>✎</i>`}</span>`)}</span>`;
}
// 個案視窗裡：別人也在編輯同一個個案時提醒
function SameCaseWarn({ caseId }) {
  const list = usePresence(), now = Date.now();
  const others = list.filter(p => p.id !== CLIENT_ID && p.caseId && p.caseId === caseId && p.lastSeen > now - 5 * 60 * 1000);
  if (!caseId || !others.length) return null;
  return html`<div class="tag t-warn" style="display:block;margin-bottom:10px;padding:8px 12px">⚠ ${[...new Set(others.map(p => p.name))].join('、')} 也正在編輯這個個案，同一個欄位後儲存的會蓋掉先儲存的，請先協調。</div>`;
}

function App() {
  const [authed, setAuthed] = useState(false), [checking, setChecking] = useState(true);
  const [user, setUser] = useState(() => { try { return localStorage.getItem('caUserName') || ''; } catch (e) { return ''; } });
  const [tab, setTab] = useState('summary'), [month, setMonth] = useState(todayMonth());
  const [db, setDb] = useState(null), [loading, setLoading] = useState(false), [toastMsg, setToastMsg] = useState(null);
  toastFn = (msg, err) => { setToastMsg({ msg, err }); setTimeout(() => setToastMsg(null), err ? 6000 : 2500); };

  const refresh = async () => {
    setLoading(true);
    try { await syncAll(); setDb(buildDb()); }
    catch (e) { console.error(e); toast('同步失敗：' + (e.message || e), true); }
    setLoading(false);
  };
  useEffect(() => { (async () => {
    if (CONFIGURED && conn.hasSaved() && await conn.fetchToken({ forceRefreshToken: false })) setAuthed(true);
    setChecking(false);
  })(); }, []);
  useEffect(() => { if (!authed) return; (async () => { await loadCache(); if (store.since.cases) setDb(buildDb()); await refresh(); })(); }, [authed]);
  // 切回這個分頁時，抓別人剛改過的資料（只抓變動的部分）
  useEffect(() => {
    if (!authed) return;
    const f = () => { if (document.visibilityState === 'visible') refresh(); };
    document.addEventListener('visibilitychange', f);
    const t = setInterval(f, 5 * 60 * 1000);
    return () => { document.removeEventListener('visibilitychange', f); clearInterval(t); };
  }, [authed]);
  // 線上名單：即時訂閱（有人上線、換頁、開個案、離開，別人的畫面馬上更新）。
  //   回報時機：換頁、開／關個案時馬上回報；沒動作時每 2 分鐘回報一次「還在」；關掉網頁時回報「離開」
  useEffect(() => {
    if (!authed || !user) return;
    let alive = true, unsub = null;
    const push = list => { if (alive) { presence.list = list || []; presence.subs.forEach(f => f()); } };
    const subscribe = () => { if (unsub) unsub(); unsub = conn.client.onUpdate('data:presence', { now: Date.now() }, push, e => console.warn('presence', e)); };
    const beat = async (leaving) => {
      try { const ed = presence.editing || {}; await call('m', 'data:heartbeat', { clientId: CLIENT_ID, name: user, page: tabRef.current, caseId: ed.id || undefined, caseLabel: ed.label || undefined, leaving: leaving || undefined }); }
      catch (e) { console.warn('presence', e); }
    };
    beat(); subscribe();
    const keep = setInterval(() => { if (document.visibilityState === 'visible') beat(); }, 2 * 60 * 1000);
    const resub = setInterval(subscribe, 60 * 60 * 1000);                       // 每小時換一次「今天來過」的時間範圍
    const tick = setInterval(() => presence.subs.forEach(f => f()), 30 * 1000);  // 「幾分鐘前離開」的文字跟著更新
    const onEdit = () => beat(), onVis = () => { if (document.visibilityState === 'visible') beat(); };
    const bye = () => beat(true);
    window.addEventListener('ca-editing', onEdit); document.addEventListener('visibilitychange', onVis); window.addEventListener('pagehide', bye);
    return () => { alive = false; if (unsub) unsub(); clearInterval(keep); clearInterval(resub); clearInterval(tick); window.removeEventListener('ca-editing', onEdit); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('pagehide', bye); };
  }, [authed, user]);
  const tabRef = useRef(tab); useEffect(() => { tabRef.current = tab; window.dispatchEvent(new Event('ca-editing')); }, [tab]);
  const logout = async () => { try { localStorage.removeItem(REFRESH_KEY); } catch (e) { } try { await call('m', 'data:heartbeat', { clientId: CLIENT_ID, name: user, leaving: true }); } catch (e) { } writeDraft(null); await IDB.clear(); location.reload(); };

  if (checking) return html`<div class="empty">載入中…</div>`;
  if (!authed) return html`<${Login} onDone=${() => setAuthed(true)} />`;
  if (!user) return html`<div class="gate"><div class="box"><div style="font-weight:700;color:var(--green)">你是哪一位？</div>
    <div class="sub" style="margin-top:6px">修改紀錄會記下這個名字</div>
    <input id="nm" placeholder="請輸入你的名字" onKeyDown=${e => { if (e.key === 'Enter' && e.target.value.trim()) { localStorage.setItem('caUserName', e.target.value.trim()); setUser(e.target.value.trim()); } }} />
    <button class="btn" onClick=${() => { const v = document.getElementById('nm').value.trim(); if (v) { localStorage.setItem('caUserName', v); setUser(v); } }}>確定</button></div></div>`;

  const TABS = [['summary', '總表'], ['report', '評鑑報表'], ['stats', '統計'], ['import', '匯入'], ['settings', '設定']];
  return html`<div>
    <div class="top">
      <span class="brand"><img src=${LOGO} alt="" />雲端資料庫<a href=${PORTAL_URL}>← 回入口網頁</a></span>
      <${OnlineAvatars} />
      ${TABS.map(([k, l]) => html`<button class=${'tabbtn' + (tab === k ? ' on' : '')} onClick=${() => setTab(k)}>${l}</button>`)}
      <span class="grow"></span>
      <label class="sub">月份 <input class="inp" type="month" value=${month} onChange=${e => e.target.value && setMonth(e.target.value)} /></label>
      <button class="btn light" disabled=${loading} onClick=${refresh}>${loading ? '同步中…' : '重新整理'}</button>
      <span class="sub">${user}</span><button class="btn sm gray" onClick=${logout} title="登出並清除這台電腦的暫存資料">登出</button>
    </div>
    ${!db ? html`<div class="empty">第一次開啟，正在下載資料…</div>`
      : tab === 'summary' ? html`<${SummaryView} db=${db} month=${month} user=${user} refresh=${refresh} />`
      : tab === 'report' ? html`<${ReportView} db=${db} month=${month} user=${user} refresh=${refresh} />`
      : tab === 'stats' ? html`<${StatsView} db=${db} month=${month} />`
      : tab === 'import' ? html`<${ImportView} db=${db} month=${month} user=${user} refresh=${refresh} />`
      : html`<div class="page"><${HolidaysCard} db=${db} user=${user} refresh=${refresh} /><${UnitsCard} db=${db} user=${user} refresh=${refresh} /></div>`}
    ${db && tab !== 'summary' && readDraft() && html`<div class="toast" style="background:var(--org,#c47a1c);cursor:pointer;bottom:90px" onClick=${() => setTab('summary')}>「${readDraft().name}」還有資料沒儲存，點這裡回去繼續填</div>`}
    ${db && html`<${FloatStats} db=${db} month=${month} />`}
    ${toastMsg && html`<div class="toast" style=${'background:' + (toastMsg.err ? 'var(--red)' : 'var(--green)')}>${toastMsg.msg}</div>`}
  </div>`;
}
// 方向鍵換格：在個案視窗（或其他表單）裡，↑↓ 跳到上／下一格，←→ 在游標已經在最前／最後時跳到左／右一格
// （文字還在中間時 ←→ 照常移動游標；下拉選單用 ↑↓ 換格，要換選項請用滑鼠或 Alt+↓ 打開）
function arrowNav(e) {
  if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey || e.isComposing) return;
  const el = e.target; if (!el || !el.matches || !el.matches('input, select, textarea')) return;
  const scope = el.closest('.drawer') || el.closest('.form'); if (!scope) return;
  if (el.type === 'checkbox' || el.type === 'radio' || el.type === 'file') return;
  const hasCaret = el.tagName !== 'SELECT' && typeof el.selectionStart === 'number';
  const nav = arrowNav.cur === el;   // 剛用方向鍵跳進來、還沒打字：整格是「選取」狀態，方向鍵直接換格（像 Excel）
  if (!nav) {
    if (hasCaret && el.selectionStart !== el.selectionEnd) return;             // 自己選取了文字時不跳
    const v = el.value || '';
    if (e.key === 'ArrowLeft' && hasCaret && el.selectionStart > 0) return;
    if (e.key === 'ArrowRight' && hasCaret && el.selectionEnd < v.length) return;
    if (el.tagName === 'TEXTAREA') {                                            // 多行：在第一行才往上、最後一行才往下
      if (e.key === 'ArrowUp' && v.slice(0, el.selectionStart).includes('\n')) return;
      if (e.key === 'ArrowDown' && v.slice(el.selectionEnd).includes('\n')) return;
    }
    if (el.list && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && v) return; // 有建議清單、正在挑選時不搶
  }
  const all = [...scope.querySelectorAll('input, select, textarea')].filter(x => !x.disabled && x.type !== 'hidden' && x.type !== 'file' && x.offsetParent !== null);
  const r0 = el.getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
  let best = null, bestScore = Infinity;
  for (const x of all) {
    if (x === el) continue;
    const r = x.getBoundingClientRect(), dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy, same = Math.abs(dy) < Math.max(r0.height, r.height) / 2;
    let score;
    if (e.key === 'ArrowRight') score = same && dx > 0 ? dx : Infinity;
    else if (e.key === 'ArrowLeft') score = same && dx < 0 ? -dx : Infinity;
    else if (e.key === 'ArrowDown') score = !same && dy > 0 ? dy * 4 + Math.abs(dx) : Infinity;
    else score = !same && dy < 0 ? -dy * 4 + Math.abs(dx) : Infinity;
    if (score < bestScore) { bestScore = score; best = x; }
  }
  if (!best && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {                // 這一列最後一格 → 下一列第一格（反之亦然）
    const i = all.indexOf(el); best = all[e.key === 'ArrowRight' ? i + 1 : i - 1] || null;
  }
  if (!best) return;
  e.preventDefault();
  best.focus(); arrowNav.cur = best;
  if (typeof best.select === 'function' && best.tagName !== 'SELECT') { try { best.select(); } catch { } }
  best.scrollIntoView({ block: 'nearest' });
}
document.addEventListener('keydown', arrowNav, true);
// 開始打字、用滑鼠點，就離開「換格」狀態
['input', 'mousedown'].forEach(t => document.addEventListener(t, () => { arrowNav.cur = null; }, true));
document.addEventListener('keydown', e => { if (arrowNav.cur && e.target === arrowNav.cur && !e.key.startsWith('Arrow') && !['Tab', 'Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) arrowNav.cur = null; }, true);
// 快捷鍵：Ctrl+F（Mac：⌘F）→ 直接跳到這一頁的搜尋框；這一頁沒有搜尋框就照瀏覽器原本的「尋找」
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'f' || e.key === 'F')) {
    const boxes = [...document.querySelectorAll('input[placeholder^="搜尋"]')].filter(el => el.offsetParent !== null);
    const box = boxes.find(el => el.closest('.drawer')) || boxes[0];   // 有開著的視窗就先找視窗裡的
    if (box) { e.preventDefault(); box.focus(); box.select(); }
  }
});
render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
