<style>
  :root{
    --ink:#3f3a33;
    --paper:#f3ede0;
    --panel:#fffcf5;
    --line:#e2d9c4;
    --teal:#748a6f;
    --teal-dark:#455943;
    --gold:#c08a3e;
    --gold-soft:#f2e3c4;
    --muted:#8a8172;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans TC",sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
    min-height:100vh;
  }
  header.top{
    background:var(--teal-dark);
    color:#f4f1e6;
    padding:34px 24px 30px;
    border-radius:0 0 28px 28px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand .logo{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;object-fit:contain;padding:7px;box-shadow:0 2px 10px rgba(18,51,48,.25);}
  header.top h1{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 8px;
    letter-spacing:.5px;
  }
  header.top p{
    margin:0;
    font-size:13.5px;
    color:#cfcabb;
    max-width:640px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 44px;}
  .hint{font-size:14px;color:var(--muted);margin:0 0 22px;}

  .grid{display:flex;flex-direction:column;gap:22px;}

  a.card{
    display:flex;
    gap:22px;
    align-items:center;
    text-decoration:none;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:26px;
    box-shadow:0 3px 18px rgba(18,51,48,.08);
    padding:32px 30px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.card:active{transform:scale(.985);}
  a.card:hover{border-color:var(--teal);box-shadow:0 6px 22px rgba(18,51,48,.12);}

  .card .icon{
    flex:none;
    width:76px;height:76px;
    border-radius:20px;
    background:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:28px;
    color:var(--gold);
  }
  .card.b .icon{background:#e6ebe0;color:var(--teal-dark);}
  .card.c .icon{background:#e3e9ee;color:#4a6274;}

  .card .body{flex:1;min-width:0;}
  .card h2{
    font-family:"Noto Serif TC",serif;
    font-size:22px;
    margin:0 0 8px;
    color:var(--teal-dark);
  }
  .card p{
    margin:0;
    font-size:14.5px;
    color:var(--muted);
  }
  .card .arrow{
    flex:none;
    font-size:28px;
    color:var(--line);
  }

  footer.foot{
    max-width:760px;margin:8px auto 0;padding:0 20px 24px;
    font-size:12px;color:var(--muted);text-align:center;
  }

  @media (max-width:600px){
    header.top{padding:26px 18px 24px;border-radius:0 0 20px 20px;}
    header.top h1{font-size:21px;}
    .wrap{padding:22px 14px 36px;}
    .grid{gap:16px;}
    a.card{padding:26px 20px;border-radius:22px;gap:16px;align-items:flex-start;}
    .card .icon{width:60px;height:60px;font-size:22px;border-radius:16px;}
    .card h2{font-size:19px;}
    .card p{font-size:14px;}
    .card .arrow{display:none;}
  }
</style>
</head>
